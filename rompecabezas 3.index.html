<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Rompecabezas Compacto</title>    <style>        * {            box-sizing: border-box;            margin: 0;            padding: 0;        }        body {            font-family: 'Segoe UI', Arial, sans-serif;            text-align: center;            min-height: 100vh;            background-color: #1a252f;            display: flex;            flex-direction: column;            align-items: center;            justify-content: center;            padding: 10px;            overflow: hidden; /* Evita scrolls incómodos en el celular */            position: relative;        }        .encabezado {            position: relative;            z-index: 10;            margin-bottom: 10px;        }        h1 {            color: #ffffff;            font-size: clamp(1.2rem, 4vw, 2rem);        }        p {            color: #bdc3c7;            font-size: clamp(0.8rem, 2.5vw, 1rem);        }        /* TABLERO CENTRAL ÚNICO (ZONA DE SOLTAR) */        #tablero-destino {            --tamano: min(75vw, 40vh, 320px);             display: grid;            grid-template-columns: repeat(3, 1fr);            grid-template-rows: repeat(3, 1fr);            gap: 3px;            width: var(--tamano);            height: var(--tamano);            border: 4px solid #ffffff;            background-color: #2c3e50;            border-radius: 8px;            box-shadow: 0 10px 20px rgba(0,0,0,0.5);            position: relative;            z-index: 5;        }        /* Celdas guía fijas del fondo */        .celda-guia {            display: flex;            justify-content: center;            align-items: center;            font-size: 24px;            font-weight: bold;            color: rgba(255, 255, 255, 0.25);            border: 1px dashed rgba(255, 255, 255, 0.15);            width: 100%;            height: 100%;        }        /* PIEZAS MÓVILES ESPARCIDAS POR AFUERA */        .pieza {            position: absolute;            width: min(22vw, 11vh, 90px);            height: min(22vw, 11vh, 90px);            display: flex;            justify-content: center;            align-items: center;            font-size: 22px;            font-weight: bold;            color: white;            cursor: grab;            touch-action: none; /* Crucial para que funcione el arrastre en celular */            border-radius: 6px;            box-shadow: 0 4px 8px rgba(0,0,0,0.4);            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);            z-index: 8;        }        .pieza:active {            cursor: grabbing;            z-index: 99; /* Se superpone a todo al arrastrar */        }        /* Cuando la pieza ya entra y se encaja en el tablero */        .celda-guia .pieza {            position: static !important;            width: 100% !important;            height: 100% !important;            box-shadow: none;            border-radius: 4px;        }        button {            background-color: #e74c3c;            color: white;            border: none;            padding: 10px 24px;            font-size: 15px;            font-weight: bold;            border-radius: 20px;            cursor: pointer;            margin-top: 15px;            box-shadow: 0 4px 10px rgba(0,0,0,0.3);            position: relative;            z-index: 10;        }    </style></head><body>    <div class="encabezado">        <h1>Rompecabezas de 9 Piezas</h1>        <p>Arrastra los bloques de los lados hacia su número en el tablero</p>    </div>        <!-- Tablero único centrado -->    <div id="tablero-destino"></div>    <button onclick="iniciarJuego()">Esparcir / Reiniciar</button>    <script>        // Paletas para simular 3 juegos de colores aleatorios        const JUEGOS_COLORES = [            ["#2ecc71", "#27ae60"],             ["#3498db", "#2980b9"],             ["#9b59b6", "#8e44ad"]          ];        let piezaArrastrada = null;        let toqueX = 0;        let toqueY = 0;        function iniciarJuego() {            const tablero = document.getElementById("tablero-destino");                        // Eliminar piezas viejas esparcidas por el cuerpo de la página            document.querySelectorAll('body > .pieza').forEach(p => p.remove());            tablero.innerHTML = "";             // 1. Generar la cuadrícula guía del 1 al 9 en el tablero central            for (let i = 0; i < 9; i++) {                const celda = document.createElement("div");                celda.classList.add("celda-guia");                celda.innerText = i + 1;                 celda.setAttribute("data-pos-correcta", i);                                // Configurar receptores de soltar (PC)                celda.addEventListener('dragover', (e) => e.preventDefault());                celda.addEventListener('drop', (e) => {                    e.preventDefault();                    if (celda.children.length === 0 && piezaArrastrada) {                        celda.appendChild(piezaArrastrada);                        verificarVictoria();                    }                });                tablero.appendChild(celda);            }            // 2. Elegir combinación de colores aleatoria            const colores = JUEGOS_COLORES[Math.floor(Math.random() * JUEGOS_COLORES.length)];            // 3. Crear las 9 piezas y esparcirlas por la pantalla de forma aleatoria alrededor            for (let idOriginal = 0; idOriginal < 9; idOriginal++) {                const pieza = document.createElement("div");                pieza.classList.add("pieza");                pieza.setAttribute("draggable", "true");                pieza.setAttribute("data-id-original", idOriginal);                pieza.innerText = idOriginal + 1;                                // Color de la pieza                pieza.style.backgroundColor = (idOriginal % 2 === 0) ? colores[0] : colores[1];                // Posicionamiento aleatorio inicial (Esquinas y bordes de la pantalla afuera del tablero)                posicionarAleatorio(pieza);                // Eventos de arrastre para PC (Mouse)                pieza.addEventListener('dragstart', (e) => { piezaArrastrada = e.target; });                // Eventos de arrastre adaptados nativamente para pantallas táctiles de celulares                pieza.addEventListener('touchstart', (e) => {                    piezaArrastrada = e.target;                    const toque = e.touches[0];                    toqueX = toque.clientX - piezaArrastrada.offsetLeft;                    toqueY = toque.clientY - piezaArrastrada.offsetTop;                }, { passive: true });                pieza.addEventListener('touchmove', (e) => {                    e.preventDefault();                    if (!piezaArrastrada || piezaArrastrada.parentElement !== document.body) return;                    const toque = e.touches[0];                    piezaArrastrada.style.left = (toque.clientX - toqueX) + 'px';                    piezaArrastrada.style.top = (toque.clientY - toqueY) + 'px';                }, { passive: false });                pieza.addEventListener('touchend', (e) => {                    if (!piezaArrastrada) return;                    const cambio = e.changedTouches[0];                    const elementoDestino = document.elementFromPoint(cambio.clientX, cambio.clientY);                                        // Buscar si se soltó sobre una celda del tablero                    const celda = elementoDestino ? elementoDestino.closest('.celda-guia') : null;                    if (celda && celda.children.length === 0) {                        celda.appendChild(piezaArrastrada);                        verificarVictoria();                    } else {                        // Si se suelta en cualquier otro lado, se queda ahí en la pantalla                        if(piezaArrastrada.parentElement === document.body) {                            piezaArrastrada.style.left = (cambio.clientX - piezaArrastrada.offsetWidth/2) + 'px';                            piezaArrastrada.style.top = (cambio.clientY - piezaArrastrada.offsetHeight/2) + 'px';                        }                    }                });                document.body.appendChild(pieza);            }        }        // Distribuye las piezas de forma aleatoria evitando el centro exacto donde está el tablero        function posicionarAleatorio(pieza) {            const anchoPantalla = window.innerWidth;            const altoPantalla = window.innerHeight;                        let x, y;            // Mitad de veces a los lados izquierdo/derecho, mitad arriba/abajo            if (Math.random() > 0.5) {                x = Math.random() > 0.5 ? Math.random() * 15 : 80 + Math.random() * 10;                y = Math.random() * 80;            } else {                x = Math.random() * 80;                y = Math.random() > 0.5 ? Math.random() * 15 : 75 + Math.random() * 15;            }            pieza.style.left = x + 'vw';            pieza.style.top = y + 'vh';        }        function verificarVictoria() {            const celdas = document.querySelectorAll('.celda-guia');            let ganar = true;            let completadas = 0;            celdas.forEach(celda => {                const piezaDins = celda.querySelector('.pieza');                if (piezaDins) {                    completadas++;                    if (celda.getAttribute('data-pos-correcta') !== piezaDins.getAttribute('data-id-original')) {                        ganar = false;                    }                } else {                    ganar = false;                }            });            if (ganar && completadas === 9) {                setTimeout(() => {
