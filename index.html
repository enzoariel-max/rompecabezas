<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rompecabezas Magnético</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            background-color: #1a252f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            overflow-x: hidden;
        }

        .encabezado { margin-top: 10px; margin-bottom: 10px; }
        h1 { color: #ffffff; font-size: clamp(1.2rem, 5vw, 1.8rem); }
        p { color: #bdc3c7; font-size: clamp(0.8rem, 3.5vw, 1rem); }

        /* TABLERO CENTRAL */
        #tablero-destino {
            --tamano: min(85vw, 38vh, 320px); 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            width: var(--tamano);
            height: var(--tamano);
            border: 4px solid #ffffff;
            background-color: #2c3e50;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            position: relative;
        }

        .celda-guia {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* BANCO DE PIEZAS INFERIOR (Desparramadas ordenadamente abajo) */
        #banco-piezas {
            --tamano-banco: min(85vw, 38vh, 320px);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: var(--tamano-banco);
            height: var(--tamano-banco);
            background-color: rgba(0, 0, 0, 0.2);
            border: 2px dashed #7f8c8d;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 15px;
        }

        /* PIEZAS CON FORMA DE ROMPECABEZAS REALS */
        .pieza {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: white;
            cursor: grab;
            touch-action: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            position: relative;
            z-index: 10;
            
            /* Clip-path matemático para recortar los bordes como un rompecabezas real */
            clip-path: polygon(
                0% 20%, 35% 20%, 35% 0%, 65% 0%, 65% 20%, 100% 20%, 
                100% 35%, 85% 35%, 85% 65%, 100% 65%, 100% 100%, 
                65% 100%, 65% 80%, 35% 80%, 35% 100%, 0% 100%, 
                0% 65%, 15% 65%, 15% 35%, 0% 35%
            );
        }

        /* Estado al arrastrar */
        .pieza.arrastrando {
            position: fixed !important;
            width: min(24vw, 10vh, 80px) !important;
            height: min(24vw, 10vh, 80px) !important;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
        }

        /* Cuando la pieza ya se imantó en el tablero */
        .celda-guia .pieza {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            cursor: default;
            transform: none !important;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="encabezado">
        <h1>Rompecabezas Real</h1>
        <p>Arrastra las piezas de abajo y acércalas a su número</p>
    </div>
    
    <div id="tablero-destino"></div>
    <div id="banco-piezas"></div>

    <button onclick="iniciarJuego()">Mezclar de Nuevo</button>

    <script>
        const COLORES = [
            ["#2ecc71", "#27ae60"], 
            ["#3498db", "#2980b9"], 
            ["#9b59b6", "#8e44ad"]  
        ];

        let piezaActiva = null;

        function iniciarJuego() {
            const tablero = document.getElementById("tablero-destino");
            const banco = document.getElementById("banco-piezas");
            tablero.innerHTML = ""; 
            banco.innerHTML = ""; 

            // Crear las 9 celdas destino en el tablero central
            for (let i = 0; i < 9; i++) {
                const celda = document.createElement("div");
                celda.classList.add("celda-guia");
                celda.innerText = i + 1; 
                celda.setAttribute("data-pos-correcta", i);
                tablero.appendChild(celda);
            }

            const juegoColores = COLORES[Math.floor(Math.random() * COLORES.length)];
            let lista = "0,1,2,3,4,5,6,7,8".split(",");
            lista.sort(() => Math.random() - 0.5); 

            // Crear las piezas y ubicarlas en el banco de abajo desordenadas
            lista.forEach(idStr => {
                let idOriginal = parseInt(idStr);
                const celdaBanco = document.createElement("div");
                celdaBanco.style.position = "relative";

                const pieza = document.createElement("div");
                pieza.classList.add("pieza");
                pieza.setAttribute("data-id-original", idOriginal);
                pieza.innerText = idOriginal + 1;
                pieza.style.backgroundColor = (idOriginal % 2 === 0) ? juegoColores[0] : juegoColores[1];

                configurarControlesTactiles(pieza);
                
                celdaBanco.appendChild(pieza);
                banco.appendChild(celdaBanco);
            });
        }

        function configurarControlesTactiles(pieza) {
            // Manejador unificado para Mouse y Touch
            const iniciarArrastre = (clientX, clientY) => {
                if (pieza.parentElement.classList.contains('celda-guia')) return; // Ya encajada
                piezaActiva = pieza;
                piezaActiva.classList.add('arrastrando');
                actualizarPosicion(clientX, clientY);
            };

            pieza.addEventListener('touchstart', (e) => {
                iniciarArrastre(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            pieza.addEventListener('mousedown', (e) => {
                iniciarArrastre(e.clientX, e.clientY);
            });
        }

        function actualizarPosicion(x, y) {
            if (!piezaActiva) return;
            piezaActiva.style.left = x + 'px';
            piezaActiva.style.top = y + 'px';
        }

        // Movimiento global (Pantalla completa)
        window.addEventListener('touchmove', (e) => {
            if (!piezaActiva) return;
            actualizarPosicion(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if (!piezaActiva) return;
            actualizarPosicion(e.clientX, e.clientY);
        });

        // Soltar pieza (Evaluar efecto imán)
        const soltarPieza = (clientX, clientY) => {
            if (!piezaActiva) return;
            
            piezaActiva.classList.remove('arrastrando');
            const piezaGuardada = piezaActiva;
            piezaActiva = null;

            // Encontrar sobre qué celda del tablero se soltó la pieza
            const celdas = document.querySelectorAll('.celda-guia');
            let imantado = false;

            celdas.forEach(celda => {
                if (celda.children.length > 0) return; // Ya tiene una pieza

                // Obtener las coordenadas en pantalla de la celda destino
                const rect = celda.getBoundingClientRect();
                
                // EFECTO IMÁN: Si la pieza está a menos de 50 píxeles de distancia de su centro, se absorbe automáticamente
                const distanciaX = Math.abs(clientX - (rect.left + rect.width / 2));
                const distanciaY = Math.abs(clientY - (rect.top + rect.height / 2));

                if (distanciaX < 50 && distanciaY < 50) {
                    celda.appendChild(piezaGuardada);
                    imantado = true;
                    verificarVictoria();
                }
            });

            // Si no se acercó lo suficiente a ninguna celda vacía, regresa a su lugar original abajo
            if (!imantado) {
                piezaGuardada.style.left = '0';
                piezaGuardada.style.top = '0';
            }
        };

        window.addEventListener('touchend', (e) => {
            if (!piezaActiva) return;
            const cambio = e.changedTouches[0];
            soltarPieza(cambio.clientX, cambio.clientY);
        });

        window.addEventListener('mouseup', (e) => {
            soltarPieza(e.clientX, e.clientY);
        });

        function verificarVictoria() {
            const celdas = document.querySelectorAll('.celda-guia');
            let ganar = true; let completadas = 0;

            celdas.forEach(celda => {
                const piezaDins = celda.querySelector('.pieza');
                if (piezaDins) {
                    completadas++;
                    if (celda.getAttribute('data-pos-correcta') !== piezaDins.getAttribute('data-id-original')) {
                        ganar = false;
