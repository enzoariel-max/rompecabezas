<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rompecabezas Curvo Celular</title>
    <style>
        :root {
            --puzzle-size: min(90vw, 360px);
            --cell-size: calc(var(--puzzle-size) / 3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 1.5rem;
            margin: 10px 0;
            text-align: center;
        }

        #board {
            width: var(--puzzle-size);
            height: var(--puzzle-size);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid #444;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            box-sizing: border-box;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            position: relative;
        }

        #pieces-container {
            width: min(95vw, 400px);
            min-height: 140px;
            margin-top: 20px;
            padding: 15px 5px;
            background-color: #2a2a35;
            border-radius: 12px;
            border: 2px dashed #555;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .piece {
            width: var(--cell-size);
            height: var(--cell-size);
            background-repeat: no-repeat;
            background-size: var(--puzzle-size) var(--puzzle-size);
            box-sizing: border-box;
            touch-action: none;
            position: relative;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));
        }

        #p-0-0 { clip-path: url(#shape-0-0); -webkit-clip-path: url(#shape-0-0); }
        #p-0-1 { clip-path: url(#shape-0-1); -webkit-clip-path: url(#shape-0-1); }
        #p-0-2 { clip-path: url(#shape-0-2); -webkit-clip-path: url(#shape-0-2); }
        #p-1-0 { clip-path: url(#shape-1-0); -webkit-clip-path: url(#shape-1-0); }
        #p-1-1 { clip-path: url(#shape-1-1); -webkit-clip-path: url(#shape-1-1); }
        #p-1-2 { clip-path: url(#shape-1-2); -webkit-clip-path: url(#shape-1-2); }
        #p-2-0 { clip-path: url(#shape-2-0); -webkit-clip-path: url(#shape-2-0); }
        #p-2-1 { clip-path: url(#shape-2-1); -webkit-clip-path: url(#shape-2-1); }
        #p-2-2 { clip-path: url(#shape-2-2); -webkit-clip-path: url(#shape-2-2); }

        #win-message {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #4caf50;
            font-weight: bold;
            display: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        button {
            margin-top: 10px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
        }
    </style>
</head>
<body>

    <h1>Rompecabezas 3x3</h1>
    <div id="board"></div>
    <div id="win-message">¡Completado con éxito! 🎉</div>
    <button onclick="initGame()">Mezclar Piezas</button>
    <div id="pieces-container"></div>

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <clipPath id="shape-0-0" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 1 V 0.35 C 0.85,0.35 0.85,0.65 1,0.65 V 1 H 0.65 C 0.65,0.85 0.35,0.85 0.35,1 H 0 Z"/>
            </clipPath>
            <clipPath id="shape-0-1" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 1 V 0.35 C 0.85,0.35 0.85,0.65 1,0.65 V 1 H 0.65 C 0.65,1.15 0.35,1.15 0.35,1 H 0 V 0.65 C 0.15,0.65 0.15,0.35 0,0.35 Z"/>
            </clipPath>
            <clipPath id="shape-0-2" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 1 V 1 H 0.65 C 0.65,0.85 0.35,0.85 0.35,1 H 0 V 0.65 C 0.15,0.65 0.15,0.35 0,0.35 Z"/>
            </clipPath>
            <clipPath id="shape-1-0" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 0.35 C 0.35,0.15 0.65,0.15 0.65,0 H 1 V 0.35 C 0.85,0.35 0.85,0.65 1,0.65 V 1 H 0 Z"/>
            </clipPath>
            <clipPath id="shape-1-1" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 0.35 C 0.35,-0.15 0.65,-0.15 0.65,0 H 1 V 0.35 C 1.15,0.35 1.15,0.65 1,0.65 V 1 H 0.65 C 0.65,0.85 0.35,0.85 0.35,1 H 0 V 0.65 C 0.15,0.65 0.15,0.35 0,0.35 Z"/>
            </clipPath>
            <clipPath id="shape-1-2" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 0.35 C 0.35,0.15 0.65,0.15 0.65,0 H 1 V 1 H 0.65 C 0.65,0.85 0.35,0.85 0.35,1 H 0 V 0.65 C 0.85,0.65 0.85,0.35 0,0.35 Z"/>
            </clipPath>
            <clipPath id="shape-2-0" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 1 V 1 H 0 V 0.35 C 0.15,0.35 0.15,0.65 0,0.65 Z"/>
            </clipPath>
            <clipPath id="shape-2-1" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 0.35 C 0.35,0.15 0.65,0.15 0.65,0 H 1 V 1 H 0 V 0.35 C 0.15,0.35 0.15,0.65 0,0.65 Z"/>
            </clipPath>
            <clipPath id="shape-2-2" clipPathUnits="objectBoundingBox">
                <path d="M 0,0 H 0.35 C 0.35,0.15 0.65,0.15 0.65,0 H 1 V 1 H 0 Z"/>
            </clipPath>
        </defs>
    </svg>
    <script>
        const rows = 3;
        const cols = 3;
        const imageUrl = 'https://picsum.photos'; 

        const board = document.getElementById('board');
        const piecesContainer = document.getElementById('pieces-container');
        const winMessage = document.getElementById('win-message');

        let draggedPiece = null;
        let startX = 0;
        let startY = 0;

        function initGame() {
            board.innerHTML = '';
            piecesContainer.innerHTML = '';
            winMessage.style.display = 'none';

            const pieces = [];

            for (let r = 0; r < rows; r++) {
                for (let r_idx = 0; r_idx < cols; r_idx++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = r_idx;
                    board.appendChild(cell);

                    const piece = document.createElement('div');
                    piece.classList.add('piece');
                    piece.id = `p-${r}-${r_idx}`;
                    piece.dataset.correctRow = r;
                    piece.dataset.correctCol = r_idx;
                    
                    piece.style.backgroundImage = `url('${imageUrl}')`;
                    
                    const posX = (r_idx / (cols - 1)) * 100;
                    const posY = (r / (rows - 1)) * 100;
                    piece.style.backgroundPosition = `${posX}% ${posY}%`;

                    piece.addEventListener('touchstart', touchStart, { passive: false });
                    piece.addEventListener('touchmove', touchMove, { passive: false });
                    piece.addEventListener('touchend', touchEnd);

                    pieces.push(piece);
                }
            }

            pieces.sort(() => Math.random() - 0.5);
            pieces.forEach(p => piecesContainer.appendChild(p));
        }

        function touchStart(e) {
            draggedPiece = this;
            const touch = e.touches[0];
            
            startX = touch.clientX - this.getBoundingClientRect().left;
            startY = touch.clientY - this.getBoundingClientRect().top;
            
            this.style.position = 'fixed';
            this.style.zIndex = '1000';
            this.style.width = 'calc(var(--puzzle-size) / 3)';
            this.style.height = 'calc(var(--puzzle-size) / 3)';
            
            moveAt(touch.clientX, touch.clientY);
        }

        function moveAt(clientX, clientY) {
            if (!draggedPiece) return;
            draggedPiece.style.left = `${clientX - startX}px`;
            draggedPiece.style.top = `${clientY - startY}px`;
        }

        function touchMove(e) {
            if (!draggedPiece) return;
            e.preventDefault();
            const touch = e.touches[0];
            moveAt(touch.clientX, touch.clientY);
        }

        function touchEnd(e) {
            if (!draggedPiece) return;
            
            const touch = e.changedTouches[0];
            draggedPiece.style.position = 'static';
            draggedPiece.style.zIndex = '';
            
            const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
            const targetCell = elementUnder ? elementUnder.closest('.cell') : null;

            if (targetCell && targetCell.children.length === 0) {
                targetCell.appendChild(draggedPiece);
            } else {
                piecesContainer.appendChild(draggedPiece);
            }
            
            draggedPiece = null;
            checkWin();
        }

        function checkWin() {
            const cells = document.querySelectorAll('.cell');
            let correct = 0;

            cells.forEach(cell => {
                const piece = cell.firstElementChild;
                if (piece && 
                    piece.dataset.correctRow === cell.dataset.row && 
                    piece.dataset.correctCol === cell.dataset.col) {
                    correct++;
                }
            });

            if (correct === 9) {
                winMessage.style.display = 'block';
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
