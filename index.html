<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rompecabezas Seguro Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            background-color: #1a252f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }
        .encabezado { margin-top: 10px; margin-bottom: 15px; z-index: 10; }
        h1 { color: #ffffff; font-size: clamp(1.2rem, 5vw, 1.8rem); }
        p { color: #bdc3c7; font-size: clamp(0.8rem, 3.5vw, 1rem); }
        #tablero-destino {
            --tamano: min(85vw, 38vh, 300px); 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: var(--tamano);
            height: var(--tamano);
            border: 4px solid #ffffff;
            background-color: #2c3e50;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
            padding: 2px;
        }
        .celda-guia {
            width: 100%; height: 100%; position: relative;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            display: flex; justify-content: center; align-items: center;
        }
        .celda-guia::after {
            content: ""; position: absolute; width: 25%; height: 25%;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%; background-color: #2c3e50;
        }
        .pieza {
            position: absolute;
            width: min(24vw, 11vh, 90px);
            height: min(24vw, 11vh, 90px);
            cursor: grab; touch-action: none; z-index: 50;
            background-size: 300% 300%; border: 2px solid #ffffff;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
            border-radius: 24px 8px 24px 8px; 
        }
        .pieza:nth-child(even) { border-radius: 8px 24px 8px 24px; }
        .pieza:active { cursor: grabbing; z-index: 999; transform: scale(1.05); }
        .celda-guia .pieza {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            box-shadow: none; border: 1px solid rgba(255,255,255,0.4);
        }
        button {
            background-color: #e74c3c; color: white; border: none; padding: 10px 24px;
            font-size: 15px; font-weight: bold; border-radius: 20px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: fixed; bottom: 15px; z-index: 100;
        }
    </style>
</head>
<body>
    <div class="encabezado">
        <h1>Rompecabezas Curvo</h1>
        <p>Arrastra las piezas de abajo y encájalas en su posición</p>
    </div>
    <div id="tablero-destino"></div>
    <button onclick="iniciarJuego()">Mezclar de Nuevo</button>
    <script>
        const IMAGENES_JUEGOS = [
            "https://picsum.photos", 
            "https://picsum.photos", 
            "https://picsum.photos"
        ];
        let piezaActiva = null; let despliegueX = 0; let despliegueY = 0;

        function iniciarJuego() {
            const tablero = document.getElementById("tablero-destino");
            document.querySelectorAll('body > .pieza').forEach(p => p.remove());
            tablero.innerHTML = ""; 

            for (let i = 0; i < 9; i++) {
                const celda = document.createElement("div");
                celda.classList.add("celda-guia");
                celda.setAttribute("data-pos-correcta", i);
                celda.addEventListener('dragover', (e) => e.preventDefault());
                celda.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (celda.children.length === 0 && piezaActiva) {
                        celda.appendChild(piezaActiva); piezaActiva = null; verificarVictoria();
                    }
                });
                tablero.appendChild(celda);
            }

            const imagenActual = IMAGENES_JUEGOS[Math.floor(Math.random() * IMAGENES_JUEGOS.length)];
            
            // Lógica súper simplificada sin caracteres que confundan al editor de código
            let misPiezas =;
            misPiezas.sort(function() { return Math.random() - 0.5; });

            misPiezas.forEach(function(idOriginal, indice) {
                const pieza = document.createElement("div");
                pieza.classList.add("pieza");
                pieza.setAttribute("draggable", "true");
                pieza.setAttribute("data-id-original", idOriginal);
                
                pieza.style.backgroundImage = "url('" + imagenActual + "')";
                let xPorcentaje = (idOriginal % 3) * 50; 
                let yPorcentaje = Math.floor(idOriginal / 3) * 50; 
                pieza.style.backgroundPosition = xPorcentaje + "% " + yPorcentaje + "%";

                esparcirAbajo(pieza, indice);

                pieza.addEventListener('dragstart', function(e) { piezaActiva = e.target; });

                pieza.addEventListener('touchstart', function(e) {
                    if (pieza.parentElement.classList.contains('celda-guia')) return;
                    piezaActiva = e.target;
                    let toque = e.touches[0];
                    despliegueX = toque.clientX - piezaActiva.offsetLeft;
                    despliegueY = toque.clientY - piezaActiva.offsetTop;
                }, { passive: true });

                pieza.addEventListener('touchmove', function(e) {
                    if (!piezaActiva || piezaActiva.parentElement !== document.body) return;
                    e.preventDefault(); 
                    let toque = e.touches[0];
                    piezaActiva.style.left = (toque.clientX - despliegueX) + 'px';
                    piezaActiva.style.top = (toque.clientY - despliegueY) + 'px';
                }, { passive: false });

                pieza.addEventListener('touchend', function(e) {
                    if (!piezaActiva) return;
                    let toque = e.changedTouches[0];
                    evaluarSoltar(toque.clientX, toque.clientY, piezaActiva);
                    piezaActiva = null;
                });

                document.body.appendChild(pieza);
            });
        }

        function esparcirAbajo(pieza, indice) {
            let filas = Math.floor(indice / 3);
            let columnas = indice % 3;
            let margenIzquierdo = 6 + (columnas * 30);
            let margenSuperior = 54 + (filas * 13);
            pieza.style.left = margenIzquierdo + 'vw';
            pieza.style.top = margenSuperior + 'vh';
        }

        function evaluarSoltar(clientX, clientY, piezaAEv) {
            const celdas = document.querySelectorAll('.celda-guia');
            let imantado = false;
            celdas.forEach(function(celda) {
                if (celda.children.length > 0) return;
                const rect = celda.getBoundingClientRect();
                const distanciaX = Math.abs(clientX - (rect.left + rect.width / 2));
                const distanciaY = Math.abs(clientY - (rect.top + rect.height / 2));
                if (distanciaX < 45 && distanciaY < 45) {
                    celda.appendChild(piezaAEv); imantado = true; verificarVictoria();
                }
            });
            if (!imantado) {
                let idOriginal = parseInt(piezaAEv.getAttribute('data-id-original'));
                esparcirAbajo(piezaAEv, idOriginal);
            }
        }

        function verificarVictoria() {
            const celdas = document.querySelectorAll('.celda-guia');
            let ganar = true; let completadas = 0;
            celdas.forEach(function(celda) {
                const piezaDins = celda.querySelector('.pieza');
                if (piezaDins) {
                    completadas++;
                    if (celda.getAttribute('data-pos-correcta') !== piezaDins.getAttribute('data-id-original')) { ganar = false; }
                } else { ganar = false; }
            });
            if (ganar && completadas === 9) { setTimeout(function() { alert("¡Espectacular! Completaste el rompecabezas real 🏆"); }, 200); }
        }
        window.onload = iniciarJuego;
    </script>
</body>
</html>
