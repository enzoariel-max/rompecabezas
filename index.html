<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rompecabezas El Rey</title>

  <!-- Tipografías Premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* ========================================================= */
    /* VARIABLES Y ESTILOS GLOBALES                              */
    /* ========================================================= */
    :root {
      --bg: #0a0a0a;
      --gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.7);
      --ink: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      touch-action: pan-x pan-y;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 10px 24px 10px;
      background: radial-gradient(circle at 50% 15%, #1d180a 0%, #0a0a0a 75%);
    }

    .game-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ENCABEZADO */
    .header {
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
    }

    .badge-top {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 10px var(--gold-glow);
      margin-bottom: 2px;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 15px var(--gold-glow), 0 0 30px var(--gold-glow);
      line-height: 1.15;
    }

    /* ========================================================= */
    /* TABLERO 3x3 UNIFICADO                                     */
    /* ========================================================= */
    .board-container {
      width: 330px;
      height: 330px;
      position: relative;
      background: #111111;
      border: 2px solid rgba(212, 175, 55, 0.5);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.95);
      margin-bottom: 14px;
      overflow: hidden;
    }

    /* LÍNEAS DE GUÍA SVG EXACTAS (SIN NÚMEROS, CORTE UNIFICADO) */
    .board-grid-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 330px;
      height: 330px;
      pointer-events: none;
      z-index: 1;
    }

    .guide-cut-line {
      fill: none;
      stroke: rgba(212, 175, 55, 0.55);
      stroke-width: 1.6;
      stroke-dasharray: 5 3;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      width: 330px;
      height: 330px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .slot {
      width: 110px;
      height: 110px;
      position: relative;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .slot.hovered {
      background-color: rgba(212, 175, 55, 0.18);
    }

    /* ARENA DE PIEZAS INFERIOR */
    .arena-section {
      width: 100%;
      max-width: 340px;
      margin-bottom: 14px;
    }

    .arena-label {
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      opacity: 0.8;
      margin-bottom: 6px;
    }

    #arena {
      width: 100%;
      height: 230px;
      position: relative;
      overflow: visible;
      background: linear-gradient(to top, rgba(212, 175, 55, 0.06), rgba(0,0,0,0.4));
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    /* PIEZAS REALES CON MOLDES CURVOS ORGÁNICOS */
    .piece-canvas {
      width: 154px;
      height: 154px;
      position: absolute;
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.85));
      transition: transform 0.15s ease, filter 0.15s ease;
      opacity: 1 !important;
      z-index: 10;
      pointer-events: auto;
    }

    .piece-canvas.placed {
      cursor: pointer;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
      transition: none;
      z-index: 10;
    }

    .piece-canvas.dragging {
      cursor: grabbing;
      z-index: 9999 !important;
      transform: scale(1.06) rotate(0deg) !important;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 12px var(--gold-glow));
      transition: none;
      pointer-events: none;
      opacity: 1 !important;
    }

    /* BOTONES */
    .controls {
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 12px 28px;
      border-radius: 999px;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.96);
      background: rgba(212, 175, 55, 0.15);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff;
      border: 1px solid #48e68b;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      font-weight: 900;
    }

    /* MODAL DE VICTORIA */
    #modal-victoria {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #modal-victoria.active {
      display: flex;
    }

    .victory-card {
      background: #111111;
      border: 2px solid var(--gold);
      border-radius: 28px;
      padding: 28px 22px;
      width: 100%;
      max-width: 310px;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px var(--gold-glow);
    }

    .victory-crown {
      width: 48px;
      height: 48px;
      margin: 0 auto 10px auto;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 15px var(--gold-glow);
    }

    .victory-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 15px var(--gold-glow);
      margin-bottom: 2px;
    }

    .victory-subtitle {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888888;
      margin-bottom: 14px;
    }

    .code-box {
      background: #000000;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
    }

    .code-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold);
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- ENCABEZADO -->
    <header class="header">
      <div class="badge-top">Completa y gana</div>
      <h1 class="title">Rompecabezas El Rey</h1>
    </header>

    <!-- TABLERO 3x3 UNIFICADO CON LÍNEAS CURVAS DE GUÍA IDÉNTICAS A LAS PIEZAS (SIN NÚMEROS) -->
    <div class="board-container">
      <svg id="board-svg" class="board-grid-svg" viewBox="0 0 330 330"></svg>

      <!-- CASILLAS PARA LAS PIEZAS -->
      <div id="board">
        <div class="slot" data-index="0"></div>
        <div class="slot" data-index="1"></div>
        <div class="slot" data-index="2"></div>
        <div class="slot" data-index="3"></div>
        <div class="slot" data-index="4"></div>
        <div class="slot" data-index="5"></div>
        <div class="slot" data-index="6"></div>
        <div class="slot" data-index="7"></div>
        <div class="slot" data-index="8"></div>
      </div>
    </div>

    <!-- ARENA DE PIEZAS DISPERSAS -->
    <div class="arena-section">
      <div class="arena-label">Arena de Piezas</div>
      <div id="arena"></div>
    </div>

    <!-- BOTÓN DE REINICIO -->
    <div class="controls">
      <button id="btn-reset" class="btn" type="button">Reiniciar</button>
    </div>

    <!-- MODAL FLOTANTE DE VICTORIA -->
    <div id="modal-victoria">
      <div class="victory-card">
        <div class="victory-crown">👑</div>
        <h2 class="victory-title">¡VICTORIA!</h2>
        <div class="victory-subtitle">CÓDIGO DE CANJE</div>
        <div class="code-box">
          <div id="codigo-ganador" class="code-text">CÓDIGO: 0001</div>
        </div>
        <div class="modal-actions">
          <button id="btn-cobrar" class="btn btn-whatsapp" type="button">Cobrar</button>
          <button id="btn-modal-reiniciar" class="btn" type="button">Jugar de Nuevo</button>
        </div>
      </div>
    </div>
  </div>
  <!-- ================================================================= -->
<!-- BLOQUE 2: LÓGICA JAVASCRIPT CON CURVAS BÉZIER Y ENCAJE EXACTO     -->
<!-- ================================================================= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const NUMERO_WHATSAPP = "5491124050658";
      const IMAGES = ['imagen1.jpeg', 'imagen2.jpeg', 'imagen3.jpeg'];
      const FIREBASE_DB_URL = "https://rompecabeza-el-rey-default-rtdb.firebaseio.com";
      const GRID_SIZE = 3;
      const PIECE_SIZE = 110;
      const TOTAL_SIZE = 330;
      const PADDING = 22; // Margen para pestañas salientes
      const CANVAS_SIZE = PIECE_SIZE + (PADDING * 2); // 154px

      const boardEl = document.getElementById('board');
      const boardSvg = document.getElementById('board-svg');
      const arenaEl = document.getElementById('arena');
      const slots = Array.from(document.querySelectorAll('.slot'));
      const btnReset = document.getElementById('btn-reset');
      const modalVictoria = document.getElementById('modal-victoria');
      const codigoGanadorEl = document.getElementById('codigo-ganador');
      const btnCobrar = document.getElementById('btn-cobrar');
      const btnModalReiniciar = document.getElementById('btn-modal-reiniciar');

      let currentImage = '';
      let gridState = new Array(9).fill(null);
      let isGameFinished = false;
      let ganadorCodigoActual = '0001';

      let draggedPiece = null;
      let touchStartX = 0;
      let touchStartY = 0;
      let pieceInitialLeft = 0;
      let pieceInitialTop = 0;
      let currentSlotHovered = null;

      // Matriz de pestañas: [Top, Right, Bottom, Left]
      // 1 = Pestaña saliente (Tab hacia afuera), -1 = Hueco entrante (Hole hacia adentro), 0 = Borde recto
      const PIECE_EDGES = [
        [0, 1, 1, 0],   // Pieza 0 (fila 0, col 0)
        [0, 1, -1, -1], // Pieza 1 (fila 0, col 1)
        [0, 0, 1, -1],  // Pieza 2 (fila 0, col 2)
        [-1, 1, -1, 0], // Pieza 3 (fila 1, col 0)
        [1, -1, 1, -1], // Pieza 4 (fila 1, col 1)
        [-1, 0, -1, 1], // Pieza 5 (fila 1, col 2)
        [1, 1, 0, 0],   // Pieza 6 (fila 2, col 0)
        [-1, 1, 0, -1], // Pieza 7 (fila 2, col 1)
        [1, 0, 0, -1]   // Pieza 8 (fila 2, col 2)
      ];

      // Dibuja las líneas de guía grabadas en el fondo del tablero usando las líneas de corte unificadas
      renderBoardGuideLines();
      initGame();

      btnReset.addEventListener('click', () => initGame());
      btnModalReiniciar.addEventListener('click', () => {
        modalVictoria.classList.remove('active');
        initGame();
      });

      btnCobrar.addEventListener('click', () => {
        const textoMensaje = `felicitaciones por finalizar el rompecabezas. Mi código es: ${ganadorCodigoActual}`;
        const urlWa = `https://wa.me/?text=${encodeURIComponent(textoMensaje)}`;
        window.location.href = urlWa;
      });

      // Trazo de una arista curva de rompecabezas clásica
      // tab: 1 = saliente (hacia afuera en sentido horario), -1 = entrante (hacia adentro), 0 = recta
      function drawPuzzleEdge(ctxOrPath, x1, y1, x2, y2, tab, isSvg = false) {
        if (tab === 0) {
          if (isSvg) return `L ${x2.toFixed(2)} ${y2.toFixed(2)} `;
          ctxOrPath.lineTo(x2, y2);
          return '';
        }

        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        const ux = dx / len;
        const uy = dy / len;
        
        // Vector normal perpendicular
        const nx = uy * tab;
        const ny = -ux * tab;

        const p = (u, n) => ({
          x: x1 + (ux * u * len) + (nx * n * len),
          y: y1 + (uy * u * len) + (ny * n * len)
        });

        const p0 = p(0.38, 0.0);
        const cp1 = p(0.36, 0.04);
        const cp2 = p(0.32, 0.18);
        const cp3 = p(0.50, 0.20);
        const cp4 = p(0.68, 0.18);
        const cp5 = p(0.64, 0.04);
        const p1 = p(0.62, 0.0);

        if (isSvg) {
          return `L ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} ` +
                 `C ${cp1.x.toFixed(2)} ${cp1.y.toFixed(2)}, ${cp2.x.toFixed(2)} ${cp2.y.toFixed(2)}, ${cp3.x.toFixed(2)} ${cp3.y.toFixed(2)} ` +
                 `C ${cp4.x.toFixed(2)} ${cp4.y.toFixed(2)}, ${cp5.x.toFixed(2)} ${cp5.y.toFixed(2)}, ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} ` +
                 `L ${x2.toFixed(2)} ${y2.toFixed(2)} `;
        } else {
          ctxOrPath.lineTo(p0.x, p0.y);
          ctxOrPath.bezierCurveTo(cp1.x, cp1.y, cp2.x, cp2.y, cp3.x, cp3.y);
          ctxOrPath.bezierCurveTo(cp4.x, cp4.y, cp5.x, cp5.y, p1.x, p1.y);
          ctxOrPath.lineTo(x2, y2);
        }
      }

      function renderBoardGuideLines() {
        // Línea Vertical 1 (entre columna 0 y 1, x=110)
        let v1 = `M 110 0 ` +
                 drawPuzzleEdge(null, 110, 0, 110, 110, 1, true) +
                 drawPuzzleEdge(null, 110, 110, 110, 220, 1, true) +
                 drawPuzzleEdge(null, 110, 220, 110, 330, 1, true);

        // Línea Vertical 2 (entre columna 1 y 2, x=220)
        let v2 = `M 220 0 ` +
                 drawPuzzleEdge(null, 220, 0, 220, 110, 1, true) +
                 drawPuzzleEdge(null, 220, 110, 220, 220, -1, true) +
                 drawPuzzleEdge(null, 220, 220, 220, 330, 1, true);

        // Línea Horizontal 1 (entre fila 0 y 1, y=110)
        let h1 = `M 0 110 ` +
                 drawPuzzleEdge(null, 0, 110, 110, 110, -1, true) +
                 drawPuzzleEdge(null, 110, 110, 220, 110, 1, true) +
                 drawPuzzleEdge(null, 220, 110, 330, 110, -1, true);

        // Línea Horizontal 2 (entre fila 1 y 2, y=220)
        let h2 = `M 0 220 ` +
                 drawPuzzleEdge(null, 0, 220, 110, 220, 1, true) +
                 drawPuzzleEdge(null, 110, 220, 220, 220, -1, true) +
                 drawPuzzleEdge(null, 220, 220, 330, 220, 1, true);

        boardSvg.innerHTML = `
          <rect x="1" y="1" width="328" height="328" rx="8" class="guide-cut-line" />
          <path d="${v1}" class="guide-cut-line" />
          <path d="${v2}" class="guide-cut-line" />
          <path d="${h1}" class="guide-cut-line" />
          <path d="${h2}" class="guide-cut-line" />
        `;
      }

      function initGame() {
        isGameFinished = false;
        modalVictoria.classList.remove('active');
        gridState.fill(null);
        arenaEl.innerHTML = '';
        slots.forEach(s => s.innerHTML = '');
        clearSlotHover();

        const randomIndex = Math.floor(Math.random() * IMAGES.length);
        currentImage = IMAGES[randomIndex];

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          buildPuzzlePieces(img);
        };
        img.src = currentImage;
      }

      function buildPuzzlePieces(img) {
        for (let i = 0; i < 9; i++) {
          const col = i % GRID_SIZE;
          const row = Math.floor(i / GRID_SIZE);
          const [t, r, b, l] = PIECE_EDGES[i];

          const canvas = document.createElement('canvas');
          canvas.width = CANVAS_SIZE;
          canvas.height = CANVAS_SIZE;
          canvas.classList.add('piece-canvas');
          canvas.dataset.pieceIndex = i;
          canvas.dataset.currentSlot = -1;

          const ctx = canvas.getContext('2d');

          // Vértices del cuerpo cuadrado central dentro del canvas (con margen PADDING)
          const x0 = PADDING;
          const y0 = PADDING;
          const x1 = PADDING + PIECE_SIZE;
          const y1 = PADDING + PIECE_SIZE;

          // Dibujamos el contorno curvo exacto del rompecabezas
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          drawPuzzleEdge(ctx, x0, y0, x1, y0, t); // Top
          drawPuzzleEdge(ctx, x1, y0, x1, y1, r); // Right
          drawPuzzleEdge(ctx, x1, y1, x0, y1, b); // Bottom
          drawPuzzleEdge(ctx, x0, y1, x0, y0, l); // Left
          ctx.closePath();

          // Recortamos la forma exacta de la pieza
          ctx.save();
          ctx.clip();

          // Dibujamos el fragmento de la imagen correspondiente a toda el área (incluyendo salientes)
          const srcX = (col * PIECE_SIZE) - PADDING;
          const srcY = (row * PIECE_SIZE) - PADDING;
          const scaleX = img.naturalWidth / TOTAL_SIZE;
          const scaleY = img.naturalHeight / TOTAL_SIZE;

          ctx.drawImage(
            img,
            srcX * scaleX,
            srcY * scaleY,
            CANVAS_SIZE * scaleX,
            CANVAS_SIZE * scaleY,
            0,
            0,
            CANVAS_SIZE,
            CANVAS_SIZE
          );
          ctx.restore();

          // Sutil relieve de corte dorado en el borde
          ctx.save();
          ctx.lineWidth = 1;
          ctx.strokeStyle = "rgba(212, 175, 55, 0.4)";
          ctx.stroke();
          ctx.restore();

          // Posicionamiento disperso aleatorio en la Arena
          const arenaRect = arenaEl.getBoundingClientRect();
          const maxArenaW = arenaRect.width > 0 ? arenaRect.width : 340;
          const maxLeft = Math.max(0, maxArenaW - CANVAS_SIZE - 4);
          const maxTop = Math.max(0, 230 - CANVAS_SIZE - 4);

          const randomLeft = Math.floor(Math.random() * (maxLeft + 1));
          const randomTop = Math.floor(Math.random() * (maxTop + 1));
          const randomRotation = Math.floor(Math.random() * 20) - 10;

          canvas.dataset.rot = randomRotation;
          canvas.style.left = `${randomLeft}px`;
          canvas.style.top = `${randomTop}px`;
          canvas.style.transform = `rotate(${randomRotation}deg)`;

          bindPieceEvents(canvas);
          arenaEl.appendChild(canvas);
        }
      }

      function bindPieceEvents(el) {
        el.addEventListener('touchstart', (e) => {
          if (isGameFinished) return;
          const touch = e.touches[0];
          startDrag(el, touch.clientX, touch.clientY);
        }, { passive: false });

        el.addEventListener('mousedown', (e) => {
          if (isGameFinished) return;
          startDrag(el, e.clientX, e.clientY);

          const onMouseMove = (moveEvent) => {
            handleMove(moveEvent.clientX, moveEvent.clientY);
          };

          const onMouseUp = (upEvent) => {
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('mouseup', onMouseUp);
            endDrag(upEvent.clientX, upEvent.clientY);
          };

          window.addEventListener('mousemove', onMouseMove);
          window.addEventListener('mouseup', onMouseUp);
        });
      }

      window.addEventListener('touchmove', (e) => {
        if (!draggedPiece) return;
        if (e.cancelable) e.preventDefault();
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if (!draggedPiece) return;
        const touch = e.changedTouches[0];
        endDrag(touch.clientX, touch.clientY);
      });

      function startDrag(el, clientX, clientY) {
        draggedPiece = el;
        touchStartX = clientX;
        touchStartY = clientY;

        const rect = el.getBoundingClientRect();
        pieceInitialLeft = rect.left;
        pieceInitialTop = rect.top;

        const currentSlot = parseInt(el.dataset.currentSlot, 10);
        if (currentSlot !== -1) {
          gridState[currentSlot] = null;
          el.dataset.currentSlot = -1;
        }

        document.body.appendChild(el);
        el.style.left = `${pieceInitialLeft}px`;
        el.style.top = `${pieceInitialTop}px`;
        el.style.transform = 'scale(1.06) rotate(0deg)';
        el.classList.add('dragging');
        el.classList.remove('placed');
      }

      function handleMove(clientX, clientY) {
        if (!draggedPiece) return;

        const deltaX = clientX - touchStartX;
        const deltaY = clientY - touchStartY;

        draggedPiece.style.left = `${pieceInitialLeft + deltaX}px`;
        draggedPiece.style.top = `${pieceInitialTop + deltaY}px`;

        checkSlotHover(clientX, clientY);
      }

      function endDrag(clientX, clientY) {
        if (!draggedPiece) return;
        const el = draggedPiece;
        el.classList.remove('dragging');

        const targetSlotIndex = findTargetSlot(clientX, clientY);

        if (targetSlotIndex !== -1) {
          if (gridState[targetSlotIndex] !== null && gridState[targetSlotIndex] !== el) {
            const occupiedPiece = gridState[targetSlotIndex];
            returnPieceToArena(occupiedPiece);
          }
          snapPieceToSlot(el, targetSlotIndex);
        } else {
          dropPieceToArena(el, clientX, clientY);
        }

        clearSlotHover();
        draggedPiece = null;
        checkVictory();
      }

      function checkSlotHover(clientX, clientY) {
        clearSlotHover();
        const slotIdx = findTargetSlot(clientX, clientY);
        if (slotIdx !== -1) {
          slots[slotIdx].classList.add('hovered');
          currentSlotHovered = slots[slotIdx];
        }
      }

      function clearSlotHover() {
        if (currentSlotHovered) {
          currentSlotHovered.classList.remove('hovered');
          currentSlotHovered = null;
        }
      }

      function findTargetSlot(clientX, clientY) {
        const boardRect = boardEl.getBoundingClientRect();
        if (
          clientX >= boardRect.left &&
          clientX <= boardRect.right &&
          clientY >= boardRect.top &&
          clientY <= boardRect.bottom
        ) {
          const relX = clientX - boardRect.left;
          const relY = clientY - boardRect.top;
          const col = Math.floor(relX / PIECE_SIZE);
          const row = Math.floor(relY / PIECE_SIZE);
          const idx = row * GRID_SIZE + col;
          if (idx >= 0 && idx < 9) return idx;
        }
        return -1;
      }

      function snapPieceToSlot(piece, slotIndex) {
        const slot = slots[slotIndex];
        slot.appendChild(piece);
        piece.dataset.currentSlot = slotIndex;
        gridState[slotIndex] = piece;

        // La pieza tiene un margen de PADDING (22px) alrededor para sus pestañas
        piece.style.left = `-${PADDING}px`;
        piece.style.top = `-${PADDING}px`;
        piece.style.transform = 'rotate(0deg)';
        piece.classList.add('placed');
      }

      function dropPieceToArena(piece, clientX, clientY) {
        arenaEl.appendChild(piece);
        piece.dataset.currentSlot = -1;
        piece.classList.remove('placed');

        const arenaRect = arenaEl.getBoundingClientRect();
        let localX = clientX - arenaRect.left - (CANVAS_SIZE / 2);
        let localY = clientY - arenaRect.top - (CANVAS_SIZE / 2);

        const maxW = Math.max(0, arenaRect.width - CANVAS_SIZE);
        const maxH = Math.max(0, 230 - CANVAS_SIZE);

        localX = Math.max(0, Math.min(localX, maxW));
        localY = Math.max(0, Math.min(localY, maxH));

        const rot = piece.dataset.rot || 0;
        piece.style.left = `${localX}px`;
        piece.style.top = `${localY}px`;
        piece.style.transform = `rotate(${rot}deg)`;
      }

      function returnPieceToArena(piece) {
        arenaEl.appendChild(piece);
        piece.dataset.currentSlot = -1;
        piece.classList.remove('placed');

        const arenaRect = arenaEl.getBoundingClientRect();
        const maxW = Math.max(0, arenaRect.width - CANVAS_SIZE);
        const maxH = Math.max(0, 230 - CANVAS_SIZE);
        const randomLeft = Math.floor(Math.random() * (maxW + 1));
        const randomTop = Math.floor(Math.random() * (maxH + 1));
        const rot = piece.dataset.rot || 0;

        piece.style.left = `${randomLeft}px`;
        piece.style.top = `${randomTop}px`;
        piece.style.transform = `rotate(${rot}deg)`;
      }

      function checkVictory() {
        for (let i = 0; i < 9; i++) {
          const piece = gridState[i];
          if (!piece) return false;
          if (parseInt(piece.dataset.pieceIndex, 10) !== i) {
            return false;
          }
        }

        isGameFinished = true;
        onPuzzleVictory();
        return true;
      }

      async function onPuzzleVictory() {
        try {
          const dbBase = FIREBASE_DB_URL.replace(/\/+$/, '');
          const endpoint = `${dbBase}/ganadores.json`;

          const nuevoRegistro = {
            timestamp: Date.now(),
            fecha: new Date().toISOString(),
            juego: "Rompecabezas El Rey",
            imagen: currentImage
          };

          await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(nuevoRegistro)
          });

          const respuesta = await fetch(`${endpoint}?v=${Date.now()}`);
          const datos = await respuesta.json();

          let totalGanadores = 1;
          if (datos && typeof datos === 'object') {
            totalGanadores = Object.keys(datos).length;
          }

          ganadorCodigoActual = String(totalGanadores).padStart(4, '0');
        } catch (error) {
          console.warn("Firebase offline o error de red:", error);
          ganadorCodigoActual = "0001";
        }

        codigoGanadorEl.textContent = `CÓDIGO: ${ganadorCodigoActual}`;
        modalVictoria.classList.add('active');
      }
    });
  </script>
</body>
</html>
