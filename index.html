<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rompecabezas El Rey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            padding: 15px;
        }

        h1 {
            font-size: 28px;
            text-transform: uppercase;
            color: #ffdf00;
            text-shadow: 0 0 10px rgba(255, 223, 0, 0.5), 0 0 20px rgba(255, 223, 0, 0.3);
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 12px;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-align: center;
        }

        #board-wrapper {
            position: relative;
            width: 330px;
            height: 330px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(255, 223, 0, 0.2);
        }

        #board {
            width: 100%;
            height: 100%;
            background-color: #151515;
            border: 3px solid #ffdf00;
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
        }

        .cell {
            width: 110px;
            height: 110px;
            border: 1px dashed rgba(255, 223, 0, 0.1);
            position: relative;
        }

        #arena {
            width: 100%;
            max-width: 360px;
            height: 220px;
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 10px;
            position: relative;
            overflow: visible;
            margin-bottom: 25px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        #resetBtn {
            background: linear-gradient(135deg, #ffdf00 0%, #cc9900 100%);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 223, 0, 0.3);
        }

        .piece {
            width: 140px;
            height: 140px;
            position: absolute;
            background-size: 330px 330px;
            background-repeat: no-repeat;
            cursor: grab;
            touch-action: none;
            z-index: 10;
        }

        .piece.dragging {
            cursor: grabbing;
            z-index: 100 !important;
        }

        /* MOLDES DE RECORTE COMPLEMENTARIOS FIJOS */
        .p0 { clip-path: polygon(10.7% 10.7%, 89.2% 10.7%, 89.2% 35.7%, 100% 35.7%, 100% 57.1%, 89.2% 57.1%, 89.2% 89.2%, 64.2% 89.2%, 64.2% 100%, 42.8% 100%, 42.8% 89.2%, 10.7% 89.2%); }
        .p1 { clip-path: polygon(10.7% 10.7%, 10.7% 35.7%, 0% 35.7%, 0% 57.1%, 10.7% 57.1%, 10.7% 89.2%, 42.8% 89.2%, 42.8% 78.5%, 64.2% 78.5%, 64.2% 89.2%, 89.2% 89.2%, 89.2% 57.1%, 100% 57.1%, 100% 35.7%, 89.2% 35.7%, 89.2% 10.7%); }
        .p2 { clip-path: polygon(10.7% 10.7%, 10.7% 35.7%, 0% 35.7%, 0% 57.1%, 10.7% 57.1%, 10.7% 89.2%, 64.2% 89.2%, 64.2% 100%, 42.8% 100%, 42.8% 89.2%, 89.2% 89.2%, 89.2% 10.7%); }
        .p3 { clip-path: polygon(10.7% 10.7%, 42.8% 10.7%, 42.8% 0%, 64.2% 0%, 64.2% 10.7%, 89.2% 10.7%, 89.2% 89.2%, 57.1% 89.2%, 57.1% 78.5%, 35.7% 78.5%, 35.7% 89.2%, 10.7% 89.2%); }
        .p4 { clip-path: polygon(10.7% 10.7%, 42.8% 10.7%, 42.8% 21.4%, 64.2% 21.4%, 64.2% 10.7%, 89.2% 10.7%, 89.2% 35.7%, 78.5% 35.7%, 78.5% 57.1%, 89.2% 57.1%, 89.2% 89.2%, 64.2% 89.2%, 64.2% 100%, 42.8% 100%, 42.8% 89.2%, 10.7% 89.2%); }
        .p5 { clip-path: polygon(10.7% 10.7%, 42.8% 10.7%, 42.8% 0%, 64.2% 0%, 64.2% 10.7%, 89.2% 10.7%, 89.2% 89.2%, 64.2% 89.2%, 64.2% 78.5%, 42.8% 78.5%, 42.8% 89.2%, 10.7% 89.2%); }
        .p6 { clip-path: polygon(10.7% 10.7%, 42.8% 10.7%, 42.8% 0%, 64.2% 0%, 64.2% 10.7%, 89.2% 10.7%, 89.2% 89.2%, 10.7% 89.2%); }
        .p7 { clip-path: polygon(10.7% 10.7%, 42.8% 10.7%, 42.8% 21.4%, 64.2% 21.4%, 64.2% 10.7%, 89.2% 10.7%, 89.2% 89.2%, 10.7% 89.2%); }
        .p8 { clip-path: polygon(10.7% 10.7%, 42.8% 10.7%, 42.8% 0%, 64.2% 0%, 64.2% 10.7%, 89.2% 10.7%, 89.2% 89.2%, 10.7% 89.2%); }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            background-color: #111111;
            border: 2px solid #ffdf00;
            box-shadow: 0 0 30px rgba(255, 223, 0, 0.4);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .modal h2 {
            color: #ffdf00;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .modal p {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .code-box {
            background-color: #222;
            border: 1px dashed #ffdf00;
            padding: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #ffdf00;
            letter-spacing: 3px;
            margin-bottom: 25px;
            border-radius: 5px;
        }

        #claimBtn {
            background: linear-gradient(135deg, #25d366 0%, #075e54 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <h1>Rompecabezas El Rey</h1>
    <div class="subtitle">Completa la imagen y gana tu código</div>

    <div id="board-wrapper">
        <div id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <div id="arena"></div>

    <button id="resetBtn">Reiniciar Juego</button>

    <div id="overlay">
        <div class="modal">
            <h2>¡Felicitaciones!</h2>
            <p>Has finalizado el rompecabezas.</p>
            <div class="code-box" id="code">CÓDIGO: ----</div>
            <button id="claimBtn">Cobrar</button>
        </div>
    </div>
    <script>
        const FIREBASE_DB_URL = "https://firebaseio.com"; 
        const IMAGES = ["imagen1.jpeg", "imagen2.jpeg", "imagen3.jpeg"];
        const WHATSAPP_NUMBER = "5491124050658";
        
        const arena = document.getElementById("arena");
        const board = document.getElementById("board");
        const boardWrapper = document.getElementById("board-wrapper");
        const resetBtn = document.getElementById("resetBtn");
        const overlay = document.getElementById("overlay");
        const codeElement = document.getElementById("code");
        const claimBtn = document.getElementById("claimBtn");
        const cells = document.querySelectorAll(".cell");

        let pieces = [];
        let currentImage = "";
        let currentCode = "0001";
        let boardState = Array(9).fill(null);

        // Sistema síncrono nativo para Firebase Realtime Database
        async function updateAndGetCounter() {
            try {
                // 1. Guardamos la victoria con una clave aleatoria única en tu panel
                await fetch(`${FIREBASE_DB_URL}ganadores.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ registro: Date.now() })
                });

                // 2. Leemos la base de datos completa para procesar el total consecutivo real
                const getRes = await fetch(`${FIREBASE_DB_URL}ganadores.json?nocache=${Date.now()}`);
                if (getRes.ok) {
                    const data = await getRes.json();
                    const totalGanadores = Object.keys(data || {}).length;
                    currentCode = String(totalGanadores).padStart(4, '0');
                } else {
                    currentCode = "0001";
                }
            } catch (e) {
                currentCode = "0001";
            }
            codeElement.innerText = `CÓDIGO: ${currentCode}`;
        }

        function initGame() {
            arena.innerHTML = "";
            overlay.style.display = "none";
            boardState.fill(null);
            pieces = [];

            currentImage = IMAGES[Math.floor(Math.random() * IMAGES.length)];

            // Mapeo milimétrico fijo para rebanar la grilla 3x3 sin distorsiones
            const posicionesFijas = [
                { x: 15, y: 15 },    // Pieza 0
                { x: -95, y: 15 },   // Pieza 1
                { x: -205, y: 15 },  // Pieza 2
                { x: 15, y: -95 },   // Pieza 3
                { x: -95, y: -95 },  // Pieza 4
                { x: -205, y: -95 }, // Pieza 5
                { x: 15, y: -205 },  // Pieza 6
                { x: -95, y: -205 }, // Pieza 7
                { x: -205, y: -205 } // Pieza 8
            ];

            for (let i = 0; i < 9; i++) {
                const piece = document.createElement("div");
                piece.classList.add("piece", `p${i}`);
                piece.dataset.correctIndex = i;
                piece.dataset.currentIndex = "arena";

                piece.style.backgroundImage = `url('${currentImage}')`;
                piece.style.backgroundPosition = `${posicionesFijas[i].x}px ${posicionesFijas[i].y}px`;

                // Dispersión inicial aleatoria abajo
                const randomX = Math.random() * (arena.clientWidth - 135);
                const randomY = Math.random() * (arena.clientHeight - 135);
                const randomRot = (Math.random() * 20) - 10;

                piece.style.left = `${randomX}px`;
                piece.style.top = `${randomY}px`;
                piece.style.transform = `rotate(${randomRot}deg)`;

                setupDragAndDrop(piece);
                arena.appendChild(piece);
                pieces.push(piece);
            }
        }

        function setupDragAndDrop(piece) {
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;
            let isDragging = false;

            // Manejo de eventos táctiles para celular (Separado y limpio)
            piece.addEventListener("touchstart", (e) => {
                isDragging = true;
                piece.classList.add("dragging");
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                initialLeft = parseFloat(piece.style.left) || 0;
                initialTop = parseFloat(piece.style.top) || 0;

                if (piece.dataset.currentIndex !== "arena") {
                    boardState[parseInt(piece.dataset.currentIndex)] = null;
                }
                piece.style.transform = "rotate(0deg)";
            }, {passive: true});

            window.addEventListener("touchmove", (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                piece.style.left = `${initialLeft + (touch.clientX - startX)}px`;
                piece.style.top = `${initialTop + (touch.clientY - startY)}px`;
            }, {passive: false});

            window.addEventListener("touchend", () => {
                if (!isDragging) return;
                isDragging = false;
                piece.classList.remove("dragging");
                processDrop(piece);
            });

            // Manejo de eventos de mouse para PC
            piece.addEventListener("mousedown", (e) => {
                isDragging = true;
                piece.classList.add("dragging");
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(piece.style.left) || 0;
                initialTop = parseFloat(piece.style.top) || 0;

                if (piece.dataset.currentIndex !== "arena") {
                    boardState[parseInt(piece.dataset.currentIndex)] = null;
                }
                piece.style.transform = "rotate(0deg)";
            });

            window.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                piece.style.left = `${initialLeft + (e.clientX - startX)}px`;
                piece.style.top = `${initialTop + (e.clientY - startY)}px`;
            });

            window.addEventListener("mouseup", () => {
                if (!isDragging) return;
                isDragging = false;
                piece.classList.remove("dragging");
                processDrop(piece);
            });
        }

        function processDrop(piece) {
            const pieceRect = piece.getBoundingClientRect();
            const pCenterX = pieceRect.left + 70;
            const pCenterY = pieceRect.top + 70;
            let placed = false;

            for (let cell of cells) {
                const cellRect = cell.getBoundingClientRect();
                const cellIdx = parseInt(cell.dataset.index);

                if (pCenterX >= cellRect.left && pCenterX <= cellRect.right &&
                    pCenterY >= cellRect.top && pCenterY <= cellRect.bottom) {
                    
                    if (boardState[cellIdx] === null) {
                        piece.style.left = `${(cellIdx % 3) * 110 - 15}px`;
                        piece.style.top = `${Math.floor(cellIdx / 3) * 110 - 15}px`;
                        boardWrapper.appendChild(piece);
                        piece.dataset.currentIndex = cellIdx;
                        boardState[cellIdx] = piece;
                        placed = true;
                        break;
                    }
                }
            }

            if (!placed) {
                arena.appendChild(piece);
                piece.dataset.currentIndex = "arena";
                piece.style.left = `${Math.random() * (arena.clientWidth - 135)}px`;
                piece.style.top = `${Math.random() * (arena.clientHeight - 135)}px`;
                piece.style.transform = `rotate(${(Math.random() * 16) - 8}deg)`;
            }

            checkVictory();
        }

        function checkVictory() {
            for (let i = 0; i < 9; i++) {
                if (!boardState[i] || parseInt(boardState[i].dataset.correctIndex) !== i) {
                    return;
                }
            }
            updateAndGetCounter().then(() => {
                overlay.style.display = "flex";
            });
        }

        claimBtn.addEventListener("click", () => {
            const message = encodeURIComponent(`felicitaciones por finalizar el rompecabezas. Mi código es: ${currentCode}`);
            window.location.href = `https://wa.me{WHATSAPP_NUMBER}?text=${message}`;
        });

        resetBtn.addEventListener("click", initGame);
        window.onload = initGame;
    </script>
</body>
</html>
