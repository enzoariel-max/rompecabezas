<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Rompecabezas Curvo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            background-color: #1a252f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        .encabezado {
            margin-top: 10px;
            margin-bottom: 15px;
            z-index: 10;
        }

        h1 {
            color: #ffffff;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
        }

        p {
            color: #bdc3c7;
            font-size: clamp(0.8rem, 3.5vw, 1rem);
        }

        #tablero-destino {
            --tamano: min(85vw, 38vh, 300px);

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);

            width: var(--tamano);
            height: var(--tamano);

            border: 4px solid #ffffff;
            background-color: #2c3e50;
            border-radius: 12px;

            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);

            margin-bottom: 20px;

            position: relative;
            z-index: 5;

            padding: 2px;
        }

        .celda-guia {
            width: 100%;
            height: 100%;

            position: relative;

            border: 2px dashed rgba(255, 255, 255, 0.25);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .celda-guia::after {
            content: "";

            position: absolute;

            width: 25%;
            height: 25%;

            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;

            background-color: #2c3e50;
        }

        .pieza {
            position: absolute;

            width: min(24vw, 11vh, 90px);
            height: min(24vw, 11vh, 90px);

            cursor: grab;
            touch-action: none;

            z-index: 50;

            background-size: 300% 300%;
            background-repeat: no-repeat;

            border: 2px solid #ffffff;

            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);

            border-radius: 24px 8px 24px 8px;

            user-select: none;
        }

        .pieza:nth-child(even) {
            border-radius: 8px 24px 8px 24px;
        }

        .pieza:active {
            cursor: grabbing;
            z-index: 999;
            transform: scale(1.05);
        }

        .celda-guia .pieza {
            position: absolute !important;

            top: 0 !important;
            left: 0 !important;

            width: 100% !important;
            height: 100% !important;

            box-shadow: none;

            border: 1px solid rgba(255, 255, 255, 0.4);

            transform: none !important;
        }

        button {
            background-color: #e74c3c;

            color: white;

            border: none;

            padding: 10px 24px;

            font-size: 15px;
            font-weight: bold;

            border-radius: 20px;

            cursor: pointer;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);

            position: fixed;

            bottom: 15px;

            z-index: 100;
        }

        button:hover {
            background-color: #ff5544;
        }
    </style>
</head>

<body>

    <div class="encabezado">
        <h1>Rompecabezas Curvo</h1>
        <p>Arrastra las piezas de abajo y encájalas en su posición</p>
    </div>

    <div id="tablero-destino"></div>

    <button onclick="iniciarJuego()">
        Mezclar de Nuevo
    </button>

    <script>

        /*
         * ==========================================
         * CONFIGURACIÓN
         * ==========================================
         */

        let piezaActiva = null;

        let despliegueX = 0;
        let despliegueY = 0;


        /*
         * ==========================================
         * INICIAR JUEGO
         * ==========================================
         */

        function iniciarJuego() {

            const tablero = document.getElementById("tablero-destino");


            // Eliminar piezas anteriores
            document.querySelectorAll("body > .pieza").forEach(function(pieza) {
                pieza.remove();
            });


            // Vaciar tablero
            tablero.innerHTML = "";


            /*
             * Crear las 9 celdas del tablero
             */

            for (let i = 0; i < 9; i++) {

                const celda = document.createElement("div");

                celda.classList.add("celda-guia");

                celda.setAttribute(
                    "data-pos-correcta",
                    i
                );


                /*
                 * Soltar con mouse
                 */

                celda.addEventListener("dragover", function(e) {
                    e.preventDefault();
                });


                celda.addEventListener("drop", function(e) {

                    e.preventDefault();

                    if (
                        celda.children.length === 0 &&
                        piezaActiva
                    ) {

                        celda.appendChild(piezaActiva);

                        piezaActiva = null;

                        verificarVictoria();
                    }

                });


                tablero.appendChild(celda);
            }


            /*
             * ==========================================
             * IMAGEN DEL ROMPECABEZAS
             * ==========================================
             *
             * Picsum genera una imagen aleatoria.
             * Usamos una semilla nueva cada vez que
             * se inicia el juego.
             */

            const semilla =
                "rompecabezas-" +
                Date.now();

            const imagenActual =
                "https://picsum.photos/seed/" +
                semilla +
                "/900/900";


            /*
             * ==========================================
             * CREAR LAS 9 PIEZAS
             * ==========================================
             */

            let misPiezas = [
                0, 1, 2,
                3, 4, 5,
                6, 7, 8
            ];


            /*
             * Mezclar piezas
             */

            misPiezas.sort(function() {
                return Math.random() - 0.5;
            });


            /*
             * Crear cada pieza
             */

            misPiezas.forEach(function(idOriginal, indice) {

                const pieza =
                    document.createElement("div");


                pieza.classList.add("pieza");


                pieza.setAttribute(
                    "draggable",
                    "true"
                );


                pieza.setAttribute(
                    "data-id-original",
                    idOriginal
                );


                /*
                 * Imagen
                 */

                pieza.style.backgroundImage =
                    "url('" +
                    imagenActual +
                    "')";


                /*
                 * Posición de la parte de la imagen
                 *
                 * 0  = izquierda
                 * 50 = centro
                 * 100 = derecha
                 */

                const xPorcentaje =
                    (idOriginal % 3) * 50;


                const yPorcentaje =
                    Math.floor(idOriginal / 3) * 50;


                pieza.style.backgroundPosition =
                    xPorcentaje +
                    "% " +
                    yPorcentaje +
                    "%";


                /*
                 * Colocar pieza abajo
                 */

                esparcirAbajo(
                    pieza,
                    indice
                );


                /*
                 * ==================================
                 * DRAG CON MOUSE
                 * ==================================
                 */

                pieza.addEventListener(
                    "dragstart",
                    function(e) {

                        piezaActiva =
                            e.currentTarget;

                    }
                );


                /*
                 * ==================================
                 * TOUCH - CELULAR
                 * ==================================
                 */

                pieza.addEventListener(
                    "touchstart",
                    function(e) {

                        if (
                            pieza.parentElement.classList.contains(
                                "celda-guia"
                            )
                        ) {
                            return;
                        }


                        piezaActiva =
                            e.currentTarget;


                        const toque =
                            e.touches[0];


                        const rect =
                            piezaActiva.getBoundingClientRect();


                        despliegueX =
                            toque.clientX -
                            rect.left;


                        despliegueY =
                            toque.clientY -
                            rect.top;

                    },
                    {
                        passive: true
                    }
                );


                pieza.addEventListener(
                    "touchmove",
                    function(e) {

                        if (
                            !piezaActiva ||
                            piezaActiva.parentElement !==
                            document.body
                        ) {
                            return;
                        }


                        e.preventDefault();


                        const toque =
                            e.touches[0];


                        piezaActiva.style.left =
                            (
                                toque.clientX -
                                despliegueX
                            ) +
                            "px";


                        piezaActiva.style.top =
                            (
                                toque.clientY -
                                despliegueY
                            ) +
                            "px";

                    },
                    {
                        passive: false
                    }
                );


                pieza.addEventListener(
                    "touchend",
                    function(e) {

                        if (!piezaActiva) {
                            return;
                        }


                        const toque =
                            e.changedTouches[0];


                        evaluarSoltar(
                            toque.clientX,
                            toque.clientY,
                            piezaActiva
                        );


                        piezaActiva = null;

                    }
                );


                /*
                 * Agregar pieza al body
                 */

                document.body.appendChild(pieza);

            });

        }


        /*
         * ==========================================
         * COLOCAR PIEZAS ABAJO
         * ==========================================
         */

        function esparcirAbajo(
            pieza,
            indice
        ) {

            const filas =
                Math.floor(indice / 3);


            const columnas =
                indice % 3;


            const margenIzquierdo =
                6 +
                (columnas * 30);


            const margenSuperior =
                54 +
                (filas * 13);


            pieza.style.left =
                margenIzquierdo +
                "vw";


            pieza.style.top =
                margenSuperior +
                "vh";

        }


        /*
         * ==========================================
         * EVALUAR DÓNDE SE SUELTA UNA PIEZA
         * ==========================================
         */

        function evaluarSoltar(
            clientX,
            clientY,
            piezaAEv
        ) {

            const celdas =
                document.querySelectorAll(
                    ".celda-guia"
                );


            let imantado = false;


            celdas.forEach(function(celda) {

                /*
                 * Si ya hay una pieza,
                 * no se puede colocar otra.
                 */

                if (
                    celda.children.length > 0
                ) {
                    return;
                }


                const rect =
                    celda.getBoundingClientRect();


                const centroX =
                    rect.left +
                    rect.width / 2;


                const centroY =
                    rect.top +
                    rect.height / 2;


                const distanciaX =
                    Math.abs(
                        clientX -
                        centroX
                    );


                const distanciaY =
                    Math.abs(
                        clientY -
                        centroY
                    );


                /*
                 * Área de imantado
                 */

                if (
                    distanciaX <
                    rect.width / 2 &&
                    distanciaY <
                    rect.height / 2
                ) {

                    celda.appendChild(
                        piezaAEv
                    );


                    imantado = true;


                    verificarVictoria();

                }

            });


            /*
             * Si no cayó en ninguna celda,
             * devolver abajo.
             */

            if (!imantado) {

                const idOriginal =
                    parseInt(
                        piezaAEv.getAttribute(
                            "data-id-original"
                        )
                    );


                esparcirAbajo(
                    piezaAEv,
                    idOriginal
                );

            }

        }


        /*
         * ==========================================
         * VERIFICAR VICTORIA
         * ==========================================
         */

        function verificarVictoria() {

            const celdas =
                document.querySelectorAll(
                    ".celda-guia"
                );


            let ganar = true;

            let completadas = 0;


            celdas.forEach(function(celda) {

                const piezaDentro =
                    celda.querySelector(
                        ".pieza"
                    );


                if (piezaDentro) {

                    completadas++;


                    const posicionCorrecta =
                        celda.getAttribute(
                            "data-pos-correcta"
                        );


                    const posicionPieza =
                        piezaDentro.getAttribute(
                            "data-id-original"
                        );


                    if (
                        posicionCorrecta !==
                        posicionPieza
                    ) {

                        ganar = false;

                    }

                } else {

                    ganar = false;

                }

            });


            if (
                ganar &&
                completadas === 9
            ) {

                setTimeout(function() {

                    alert(
                        "¡Espectacular! 🏆\n\n" +
                        "Completaste el rompecabezas."
                    );

                }, 200);

            }

        }


        /*
         * ==========================================
         * INICIAR AUTOMÁTICAMENTE
         * ==========================================
         */

        window.onload =
            iniciarJuego;

    </script>

</body>
</html>
