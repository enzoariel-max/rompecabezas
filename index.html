<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rompecabezas El Rey</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            padding: 15px;
        }

        h1 {
            font-size: 28px;
            text-transform: uppercase;
            color: #ffdf00;
            text-shadow: 0 0 10px rgba(255, 223, 0, 0.5), 0 0 20px rgba(255, 223, 0, 0.3);
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 12px;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-align: center;
        }

        #board-wrapper {
            position: relative;
            width: 336px;
            height: 336px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(255, 223, 0, 0.2);
            background-color: #151515;
            border: 3px solid #ffdf00;
            border-radius: 12px;
            padding: 3px;
        }

        #board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 0px;
        }

        .cell {
            width: 110px;
            height: 110px;
            border: 1px dashed rgba(255, 223, 0, 0.15);
            position: relative;
        }

        #arena {
            width: 100%;
            max-width: 360px;
            height: 240px;
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 14px;
            position: relative;
            overflow: visible;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        #resetBtn {
            background: linear-gradient(135deg, #ffdf00 0%, #cc9900 100%);
            color: #000;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 223, 0, 0.3);
        }

        /* DISEÑO DE PIEZAS PROFESIONAL: Calce perfecto 3D sin desalinear la imagen */
        .piece {
            width: 110px;
            height: 110px;
            position: absolute;
            background-size: 330px 330px;
            background-repeat: no-repeat;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 0 4px rgba(255,255,255,0.2);
            border: 1px solid rgba(0,0,0,0.2);
            cursor: grab;
            touch-action: none;
            z-index: 10;
        }

        .piece.dragging {
            cursor: grabbing;
            z-index: 100 !important;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            transform: scale(1.05);
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            background-color: #111111;
            border: 2px solid #ffdf00;
            box-shadow: 0 0 30px rgba(255, 223, 0, 0.4);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .modal h2 {
            color: #ffdf00;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .modal p {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .code-box {
            background-color: #222;
            border: 1px dashed #ffdf00;
            padding: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #ffdf00;
            letter-spacing: 3px;
            margin-bottom: 25px;
            border-radius: 5px;
        }

        #claimBtn {
            background: linear-gradient(135deg, #25d366 0%, #075e54 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <h1>Rompecabezas El Rey</h1>
    <div class="subtitle">Completa la imagen y gana tu código</div>

    <div id="board-wrapper">
        <div id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <div id="arena"></div>

    <button id="resetBtn">Reiniciar Juego</button>

    <div id="overlay">
        <div class="modal">
            <h2>¡Felicitaciones!</h2>
            <p>Has finalizado el rompecabezas.</p>
            <div class="code-box" id="code">CÓDIGO: ----</div>
            <button id="claimBtn">Cobrar</button>
        </div>
    </div>
    <script>
        // URL exclusiva verificada de tu Firebase Realtime Database
        const FIREBASE_DB_URL = "https://firebaseio.com"; 
        
        const IMAGES = ["imagen1.jpeg", "imagen2.jpeg", "imagen3.jpeg"];
        const WHATSAPP_NUMBER = "5491124050658";
        
        const arena = document.getElementById("arena");
        const board = document.getElementById("board");
        const boardWrapper = document.getElementById("board-wrapper");
        const resetBtn = document.getElementById("resetBtn");
        const overlay = document.getElementById("overlay");
        const codeElement = document.getElementById("code");
        const claimBtn = document.getElementById("claimBtn");
        const cells = document.querySelectorAll(".cell");

        let pieces = [];
        let currentImage = "";
        let currentCode = "0001";
        let boardState = Array(9).fill(null);

        // Conexión directa y pura a tu base de datos de Firebase
        async function updateAndGetCounter() {
            try {
                // 1. Enviamos un POST (registro histórico de victoria) a tu nodo "ganadores"
                await fetch(`${FIREBASE_DB_URL}ganadores.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timestamp: Date.now() })
                });

                // 2. Leemos inmediatamente el nodo para contar el total real de registros
                const getRes = await fetch(`${FIREBASE_DB_URL}ganadores.json?nocache=${Date.now()}`);
                if (getRes.ok) {
                    const data = await getRes.json();
                    // Contamos la cantidad de claves únicas dentro del objeto de Firebase
                    const totalGanadores = Object.keys(data || {}).length;
                    currentCode = String(totalGanadores).padStart(4, '0');
                } else {
                    currentCode = "0001";
                }
            } catch (e) {
                // Fallback por si hay microcortes de red local
                currentCode = "0001";
            }
            codeElement.innerText = `CÓDIGO: ${currentCode}`;
        }

        function initGame() {
            arena.innerHTML = "";
            overlay.style.display = "none";
            boardState.fill(null);
            pieces = [];

            // Elige una imagen aleatoria del array de GitHub
            currentImage = IMAGES[Math.floor(Math.random() * IMAGES.length)];

            for (let i = 0; i < 9; i++) {
                const piece = document.createElement("div");
                piece.classList.add("piece", `p${i}`);
                piece.dataset.correctIndex = i;
                piece.dataset.currentIndex = "arena";

                piece.style.backgroundImage = `url('${currentImage}')`;

                // Dispersión aleatoria en el contenedor inferior para que queden desordenadas
                const randomX = Math.random() * (arena.clientWidth - 135);
                const randomY = Math.random() * (arena.clientHeight - 135);
                const randomRot = (Math.random() * 20) - 10; // Lenta rotación estética

                piece.style.left = `${randomX}px`;
                piece.style.top = `${randomY}px`;
                piece.style.transform = `rotate(${randomRot}deg)`;

                setupDragAndDrop(piece);
                arena.appendChild(piece);
                pieces.push(piece);
            }
        }

        function setupDragAndDrop(piece) {
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;

            function onStart(e) {
                piece.classList.add("dragging");
                const touch = e.touches ? e.touches[0] : e;

                startX = touch.clientX;
                startY = touch.clientY;
                initialLeft = parseFloat(piece.style.left) || 0;
                initialTop = parseFloat(piece.style.top) || 0;
                
                // Si la pieza se mueve desde el tablero superior, liberamos la celda
                if (piece.dataset.currentIndex !== "arena") {
                    const cellIdx = parseInt(piece.dataset.currentIndex);
                    boardState[cellIdx] = null;
                }
                piece.style.transform = "rotate(0deg)";
            }

            function onMove(e) {
                if (!piece.classList.contains("dragging")) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;

                piece.style.left = `${initialLeft + dx}px`;
                piece.style.top = `${initialTop + dy}px`;
            }

            function onEnd() {
                if (!piece.classList.contains("dragging")) return;
                piece.classList.remove("dragging");
                
                const pieceRect = piece.getBoundingClientRect();
                
                // Calculamos el centro visual exacto (descontando el desborde decorativo de las pestañas)
                const pCenterX = pieceRect.left + 70;
                const pCenterY = pieceRect.top + 70;

                let placed = false;

                for (let cell of cells) {
                    const cellRect = cell.getBoundingClientRect();
                    const cellIdx = parseInt(cell.dataset.index);

                    if (
                        pCenterX >= cellRect.left && pCenterX <= cellRect.right &&
                        pCenterY >= cellRect.top && pCenterY <= cellRect.bottom
                    ) {
                        // REGLA DE ERROR: Se queda fija temporalmente aunque la casilla no sea la correcta
                        if (boardState[cellIdx] === null) {
                            // Centrado fijo con desfase simétrico de 15px por el margen de la pestaña estándar
                            piece.style.left = `${(cellIdx % 3) * 110 - 15}px`;
                            piece.style.top = `${Math.floor(cellIdx / 3) * 110 - 15}px`;
                            
                            boardWrapper.appendChild(piece);
                            piece.dataset.currentIndex = cellIdx;
                            boardState[cellIdx] = piece;
                            placed = true;
                            break;
                        }
                    }
                }

                // Si no se soltó en una casilla válida, regresa abajo de forma dispersa
                if (!placed) {
                    arena.appendChild(piece);
                    piece.dataset.currentIndex = "arena";
                    const randomX = Math.random() * (arena.clientWidth - 135);
                    const randomY = Math.random() * (arena.clientHeight - 135);
                    const randomRot = (Math.random() * 16) - 8;
                    piece.style.left = `${randomX}px`;
                    piece.style.top = `${randomY}px`;
                    piece.style.transform = `rotate(${randomRot}deg)`;
                }

                checkVictory();
            }

            // Eventos Táctiles Móviles nativos
            piece.addEventListener("touchstart", onStart, {passive: true});
            window.addEventListener("touchmove", onMove, {passive: false});
            window.addEventListener("touchend", onEnd);

            // Eventos de Mouse para pruebas en PC
            piece.addEventListener("mousedown", onStart);
            window.addEventListener("mousemove", onMove);
            window.addEventListener("mouseup", onEnd);
        }

        function checkVictory() {
            // Verifica si las 9 celdas están ocupadas por la pieza que corresponde a su índice correcto
            for (let i = 0; i < 9; i++) {
                if (!boardState[i] || parseInt(boardState[i].dataset.correctIndex) !== i) {
                    return; 
                }
            }
            
            // Si todas están bien ubicadas ejecuta la consulta a Firebase y levanta el cartel
            updateAndGetCounter().then(() => {
                overlay.style.display = "flex";
            });
        }

        claimBtn.addEventListener("click", () => {
            const message = encodeURIComponent(`felicitaciones por finalizar el rompecabezas. Mi código es: ${currentCode}`);
            window.location.href = `https://wa.me{1124050658}?text=${message}`;
        });

        resetBtn.addEventListener("click", initGame);
        window.onload = initGame;
    </script>
</body>
</html>
