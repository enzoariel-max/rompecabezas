<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rompecabezas El Rey</title>

  <!-- Tipografías de Alto Impacto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* ========================================================= */
    /* VARIABLES Y ESTILOS GLOBALES - BOLD TYPOGRAPHY            */
    /* ========================================================= */
    :root {
      --bg: #0a0a0a;
      --gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.65);
      --gold-dark: #8a6d1c;
      --ink: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      touch-action: pan-x pan-y;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      background: radial-gradient(circle at 50% 15%, #1c180a 0%, #0a0a0a 75%);
    }

    /* CONTENEDOR TIPO DISPOSITIVO MÓVIL */
    .device-container {
      width: 100%;
      max-width: 390px;
      min-height: 700px;
      background: #000000;
      border: 4px solid #1a1a1a;
      border-radius: 42px;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.1);
      overflow: hidden;
      padding-bottom: 20px;
    }

    /* BARRA DE ESTADO SUPERIOR */
    .status-bar {
      height: 32px;
      padding: 6px 24px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #666;
      letter-spacing: 1px;
    }

    .status-bar .right-icons {
      display: flex;
      gap: 6px;
      font-size: 10px;
      color: #777;
    }

    /* ENCABEZADO Y TÍTULO BOLD TYPOGRAPHY */
    .title-header {
      padding: 10px 16px 8px 16px;
      text-align: center;
    }

    .title-text {
      font-family: 'Cinzel', serif;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 15px var(--gold-glow), 0 0 30px var(--gold-glow);
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .edition-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.85;
    }

    /* TABLERO 3X3 (330px X 330px) */
    .board-container {
      display: flex;
      justify-content: center;
      padding: 4px 8px;
    }

    .board-frame {
      position: relative;
      width: 330px;
      height: 330px;
      padding: 1px;
      background: linear-gradient(to bottom, rgba(212, 175, 55, 0.35), rgba(212, 175, 55, 0.1));
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
    }

    #board {
      width: 330px;
      height: 330px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      position: relative;
      border-radius: 6px;
      overflow: hidden;
    }

    .slot {
      width: 110px;
      height: 110px;
      position: relative;
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .slot.hovered {
      background-color: rgba(212, 175, 55, 0.22);
      border-color: var(--gold);
    }

    .slot-number {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }

    /* ARENA DE PIEZAS DISPERSAS INFERIOR (#arena) */
    .arena-container {
      flex: 1;
      width: 100%;
      padding: 12px 16px 0 16px;
      position: relative;
    }

    .arena-title {
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--gold);
      opacity: 0.75;
      margin-bottom: 6px;
    }

    #arena {
      width: 100%;
      height: 220px;
      position: relative;
      overflow: visible;
      background: linear-gradient(to top, rgba(212, 175, 55, 0.06), transparent);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.75);
    }

    /* PIEZAS DEL ROMPECABEZAS (110px X 110px) */
    .piece {
      width: 110px;
      height: 110px;
      position: absolute;
      background-repeat: no-repeat;
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.85));
      transition: transform 0.15s ease, filter 0.15s ease;
      z-index: 10;
    }

    .piece.placed {
      cursor: pointer;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
      transition: none;
    }

    .piece.dragging {
      cursor: grabbing;
      z-index: 9999 !important;
      transform: scale(1.06) rotate(0deg) !important;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 12px var(--gold-glow));
      transition: none;
      pointer-events: none;
    }

    /* MOLDE TRADICIONAL DE PESTAÑAS (ACOPLABLES EN 3x3) */
    .p0 { clip-path: polygon(0 0, 100% 0, 100% 35%, 85% 50%, 100% 65%, 100% 100%, 65% 100%, 50% 115%, 35% 100%, 0 100%); }
    .p1 { clip-path: polygon(0 0, 100% 0, 100% 35%, 115% 50%, 100% 65%, 100% 100%, 65% 100%, 50% 85%, 35% 100%, 0 100%, 0 65%, -15% 50%, 0 35%); }
    .p2 { clip-path: polygon(0 0, 100% 0, 100% 100%, 65% 100%, 50% 115%, 35% 100%, 0 100%, 0 65%, 15% 50%, 0 35%); }
    .p3 { clip-path: polygon(0 0, 35% 0, 50% 15%, 65% 0, 100% 0, 100% 35%, 115% 50%, 100% 65%, 100% 100%, 65% 100%, 50% 85%, 35% 100%, 0 100%); }
    .p4 { clip-path: polygon(0 0, 35% 0, 50% -15%, 65% 0, 100% 0, 100% 35%, 85% 50%, 100% 65%, 100% 100%, 65% 100%, 50% 115%, 35% 100%, 0 100%, 0 65%, 15% 50%, 0 35%); }
    .p5 { clip-path: polygon(0 0, 35% 0, 50% 15%, 65% 0, 100% 0, 100% 100%, 65% 100%, 50% 85%, 35% 100%, 0 100%, 0 65%, -15% 50%, 0 35%); }
    .p6 { clip-path: polygon(0 0, 35% 0, 50% -15%, 65% 0, 100% 0, 100% 35%, 85% 50%, 100% 65%, 100% 100%, 0 100%); }
    .p7 { clip-path: polygon(0 0, 35% 0, 50% 15%, 65% 0, 100% 0, 100% 35%, 115% 50%, 100% 65%, 100% 100%, 0 100%, 0 65%, -15% 50%, 0 35%); }
    .p8 { clip-path: polygon(0 0, 35% 0, 50% -15%, 65% 0, 100% 0, 100% 100%, 0 100%, 0 65%, 15% 50%, 0 35%); }

    /* BOTONES Y CONTROLES */
    .controls {
      padding: 10px 24px 0 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--gold);
      color: #000000;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      color: #ffffff;
      border: 1px solid #48e68b;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      font-weight: 800;
    }

    /* MODAL FLOTANTE DE VICTORIA */
    #modal-victoria {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #modal-victoria.active {
      display: flex;
    }

    .victory-card {
      background: #111111;
      border: 2px solid var(--gold);
      border-radius: 28px;
      padding: 28px 20px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(212, 175, 55, 0.35);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .victory-crown {
      width: 48px;
      height: 48px;
      margin: 0 auto 10px auto;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .victory-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.2em;
      text-shadow: 0 0 15px var(--gold-glow);
      margin-bottom: 2px;
    }

    .victory-subtitle {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888888;
      margin-bottom: 14px;
    }

    .code-box {
      background: #000000;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 18px;
    }

    .code-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>

// BLOQUE 2: LÓGICA COMPLETA DE JAVASCRIPT NATIVO (Vanilla JS)
// Pegar dentro de una etiqueta <script> antes de cerrar el </body>
// =================================================================

document.addEventListener('DOMContentLoaded', () => {
  // 1. CONFIGURACIÓN Y PARÁMETROS MATRICIALES
  const IMAGES = ['imagen1.jpeg', 'imagen2.jpeg', 'imagen3.jpeg'];
  const FIREBASE_DB_URL = "https://firebaseio.com";
  const GRID_SIZE = 3;
  const PIECE_SIZE = 110;
  const TOTAL_SIZE = 330;

  // 2. REFERENCIAS A ELEMENTOS DEL DOM
  const boardEl = document.getElementById('board');
  const arenaEl = document.getElementById('arena');
  const slots = Array.from(document.querySelectorAll('.slot'));
  const editionIndicator = document.getElementById('edition-indicator');
  const btnReset = document.getElementById('btn-reset');
  const modalVictoria = document.getElementById('modal-victoria');
  const codigoGanadorEl = document.getElementById('codigo-ganador');
  const btnCobrar = document.getElementById('btn-cobrar');
  const btnModalReiniciar = document.getElementById('btn-modal-reiniciar');

  // 3. ESTADO GLOBAL DEL JUEGO
  let currentImage = '';
  let currentImageIndex = 0;
  let gridState = new Array(9).fill(null); // Casillas del tablero: almacena elemento o null
  let isGameFinished = false;
  let ganadorCodigoActual = '0001';

  // 4. CONTROL DE EVENTOS TÁCTILES Y ARRASTRE
  let draggedPiece = null;
  let touchStartX = 0;
  let touchStartY = 0;
  let pieceInitialLeft = 0;
  let pieceInitialTop = 0;
  let currentSlotHovered = null;

  // INICIALIZACIÓN
  initGame();

  // BOTONES
  btnReset.addEventListener('click', () => initGame());
  btnModalReiniciar.addEventListener('click', () => {
    modalVictoria.classList.remove('active');
    initGame();
  });

  // REDIRECCIÓN DIRECTA A WHATSAPP
  btnCobrar.addEventListener('click', () => {
    const textoMensaje = `felicitaciones por finalizar el rompecabezas. Mi código es: ${ganadorCodigoActual}`;
    const urlWa = `https://wa.me/?text=${encodeURIComponent(textoMensaje)}`;
    window.location.href = urlWa;
  });

  // =========================================================
  // CARGA ALEATORIA Y DISPERSIÓN MATRICIAL ASIMÉTRICA
  // =========================================================
  function initGame() {
    isGameFinished = false;
    modalVictoria.classList.remove('active');
    gridState.fill(null);
    arenaEl.innerHTML = '';

    // Selección aleatoria de una de las 3 imágenes
    currentImageIndex = Math.floor(Math.random() * IMAGES.length);
    currentImage = IMAGES[currentImageIndex];
    if (editionIndicator) {
      editionIndicator.textContent = `Edición ${currentImageIndex + 1} de 3`;
    }

    // Instanciar las 9 piezas con fondo fijo y coordenadas absolutas
    for (let i = 0; i < 9; i++) {
      const piece = document.createElement('div');
      piece.classList.add('piece', `p${i}`);
      piece.dataset.pieceIndex = i;
      piece.dataset.currentSlot = -1; // -1 indica que está en la arena

      // CÁLCULO MATRICIAL EXACTO: background-size 330px 330px y desfase absoluto
      const col = i % GRID_SIZE;
      const row = Math.floor(i / GRID_SIZE);
      const bgX = -(col * PIECE_SIZE);
      const bgY = -(row * PIECE_SIZE);

      piece.style.backgroundImage = `url('${currentImage}')`;
      piece.style.backgroundSize = `${TOTAL_SIZE}px ${TOTAL_SIZE}px`;
      piece.style.backgroundPosition = `${bgX}px ${bgY}px`;

      // Posicionamiento aleatorio controlado en la arena (sin desbordar)
      const arenaRect = arenaEl.getBoundingClientRect();
      const maxArenaW = arenaRect.width > 0 ? arenaRect.width : 340;
      const maxLeft = Math.max(0, maxArenaW - PIECE_SIZE - 8);
      const maxTop = Math.max(0, 220 - PIECE_SIZE - 8);

      const randomLeft = Math.floor(Math.random() * (maxLeft + 1));
      const randomTop = Math.floor(Math.random() * (maxTop + 1));
      const randomRotation = Math.floor(Math.random() * 25) - 12; // Entre -12deg y 12deg

      piece.dataset.rot = randomRotation;
      piece.style.left = `${randomLeft}px`;
      piece.style.top = `${randomTop}px`;
      piece.style.transform = `rotate(${randomRotation}deg)`;

      // Asignar controladores táctiles nativos
      bindPieceEvents(piece);

      arenaEl.appendChild(piece);
    }
  }

  // =========================================================
  // EVENTOS TÁCTILES PUROS PARA CELULARES (SIN BLOQUEOS)
  // =========================================================
  function bindPieceEvents(el) {
    // TOUCH START
    el.addEventListener('touchstart', (e) => {
      if (isGameFinished) return;
      const touch = e.touches[0];
      startDrag(el, touch.clientX, touch.clientY);
    }, { passive: false });

    // MOUSE FALLBACK (Para pruebas en navegador de escritorio)
    el.addEventListener('mousedown', (e) => {
      if (isGameFinished) return;
      startDrag(el, e.clientX, e.clientY);

      const onMouseMove = (moveEvent) => {
        handleMove(moveEvent.clientX, moveEvent.clientY);
      };

      const onMouseUp = (upEvent) => {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        endDrag(upEvent.clientX, upEvent.clientY);
      };

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });
  }

  // TOUCH MOVE Y TOUCH END GLOBALES
  window.addEventListener('touchmove', (e) => {
    if (!draggedPiece) return;
    if (e.cancelable) e.preventDefault(); // Evita scroll vertical de pantalla
    const touch = e.touches[0];
    handleMove(touch.clientX, touch.clientY);
  }, { passive: false });

  window.addEventListener('touchend', (e) => {
    if (!draggedPiece) return;
    const touch = e.changedTouches[0];
    endDrag(touch.clientX, touch.clientY);
  });

  function startDrag(el, clientX, clientY) {
    draggedPiece = el;
    touchStartX = clientX;
    touchStartY = clientY;

    const rect = el.getBoundingClientRect();
    pieceInitialLeft = rect.left;
    pieceInitialTop = rect.top;

    // Si estaba alojada en una casilla del tablero, liberarla
    const currentSlot = parseInt(el.dataset.currentSlot, 10);
    if (currentSlot !== -1) {
      gridState[currentSlot] = null;
      el.dataset.currentSlot = -1;
    }

    // Mover temporalmente al body para evitar recortes de overflow
    document.body.appendChild(el);
    el.style.left = `${pieceInitialLeft}px`;
    el.style.top = `${pieceInitialTop}px`;
    el.style.transform = 'scale(1.06) rotate(0deg)';
    el.classList.add('dragging');
    el.classList.remove('placed');
  }

  function handleMove(clientX, clientY) {
    if (!draggedPiece) return;

    const deltaX = clientX - touchStartX;
    const deltaY = clientY - touchStartY;

    draggedPiece.style.left = `${pieceInitialLeft + deltaX}px`;
    draggedPiece.style.top = `${pieceInitialTop + deltaY}px`;

    checkSlotHover(clientX, clientY);
  }

  function endDrag(clientX, clientY) {
    if (!draggedPiece) return;
    const el = draggedPiece;
    el.classList.remove('dragging');

    const targetSlotIndex = findTargetSlot(clientX, clientY);

    if (targetSlotIndex !== -1) {
      // REGLA: Si la casilla ya está ocupada por otra pieza, enviar la anterior a la arena
      if (gridState[targetSlotIndex] !== null && gridState[targetSlotIndex] !== el) {
        const occupiedPiece = gridState[targetSlotIndex];
        returnPieceToArena(occupiedPiece);
      }

      // Alojar fijamente la pieza en la casilla (correcta o incorrecta)
      snapPieceToSlot(el, targetSlotIndex);
    } else {
      // Soltada fuera del tablero: regresar y asentar en la arena
      dropPieceToArena(el, clientX, clientY);
    }

    clearSlotHover();
    draggedPiece = null;

    // Validar si el juego se completó
    checkVictory();
  }

  // =========================================================
  // DETECCIÓN DE COLISIONES Y ALOJAMIENTO EN CUADRÍCULA
  // =========================================================
  function checkSlotHover(clientX, clientY) {
    clearSlotHover();
    const slotIdx = findTargetSlot(clientX, clientY);
    if (slotIdx !== -1) {
      slots[slotIdx].classList.add('hovered');
      currentSlotHovered = slots[slotIdx];
    }
  }

  function clearSlotHover() {
    if (currentSlotHovered) {
      currentSlotHovered.classList.remove('hovered');
      currentSlotHovered = null;
    }
  }

  function findTargetSlot(clientX, clientY) {
    const boardRect = boardEl.getBoundingClientRect();
    if (
      clientX >= boardRect.left &&
      clientX <= boardRect.right &&
      clientY >= boardRect.top &&
      clientY <= boardRect.bottom
    ) {
      const relX = clientX - boardRect.left;
      const relY = clientY - boardRect.top;
      const col = Math.floor(relX / PIECE_SIZE);
      const row = Math.floor(relY / PIECE_SIZE);
      const idx = row * GRID_SIZE + col;
      if (idx >= 0 && idx < 9) return idx;
    }
    return -1;
  }

  function snapPieceToSlot(piece, slotIndex) {
    const slot = slots[slotIndex];
    slot.appendChild(piece);
    piece.dataset.currentSlot = slotIndex;
    gridState[slotIndex] = piece;

    piece.style.left = '0px';
    piece.style.top = '0px';
    piece.style.transform = 'rotate(0deg)';
    piece.classList.add('placed');
  }

  function dropPieceToArena(piece, clientX, clientY) {
    arenaEl.appendChild(piece);
    piece.dataset.currentSlot = -1;
    piece.classList.remove('placed');

    const arenaRect = arenaEl.getBoundingClientRect();
    let localX = clientX - arenaRect.left - (PIECE_SIZE / 2);
    let localY = clientY - arenaRect.top - (PIECE_SIZE / 2);

    const maxW = Math.max(0, arenaRect.width - PIECE_SIZE);
    const maxH = Math.max(0, 220 - PIECE_SIZE);

    localX = Math.max(0, Math.min(localX, maxW));
    localY = Math.max(0, Math.min(localY, maxH));

    const rot = piece.dataset.rot || 0;
    piece.style.left = `${localX}px`;
    piece.style.top = `${localY}px`;
    piece.style.transform = `rotate(${rot}deg)`;
  }

  function returnPieceToArena(piece) {
    arenaEl.appendChild(piece);
    piece.dataset.currentSlot = -1;
    piece.classList.remove('placed');

    const arenaRect = arenaEl.getBoundingClientRect();
    const maxW = Math.max(0, arenaRect.width - PIECE_SIZE);
    const maxH = Math.max(0, 220 - PIECE_SIZE);
    const randomLeft = Math.floor(Math.random() * (maxW + 1));
    const randomTop = Math.floor(Math.random() * (maxH + 1));
    const rot = piece.dataset.rot || 0;

    piece.style.left = `${randomLeft}px`;
    piece.style.top = `${randomTop}px`;
    piece.style.transform = `rotate(${rot}deg)`;
  }

  // =========================================================
  // VALIDACIÓN DE GRILLA Y CONEXIÓN DIRECTA CON FIREBASE
  // =========================================================
  function checkVictory() {
    for (let i = 0; i < 9; i++) {
      const piece = gridState[i];
      if (!piece) return false;
      if (parseInt(piece.dataset.pieceIndex, 10) !== i) {
        return false;
      }
    }

    isGameFinished = true;
    onPuzzleVictory();
    return true;
  }

  async function onPuzzleVictory() {
    try {
      const dbBase = FIREBASE_DB_URL.replace(/\/+$/, '');
      const endpoint = `${dbBase}/ganadores.json`;

      // 1. POST histórico para asentar la victoria en la nube
      const nuevoRegistro = {
        timestamp: Date.now(),
        fecha: new Date().toISOString(),
        juego: "Rompecabezas El Rey",
        imagen: currentImage
      };

      await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nuevoRegistro)
      });

      // 2. GET limpio sin caché para contar registros reales
      const respuesta = await fetch(`${endpoint}?nocache=${Date.now()}`);
      const datos = await respuesta.json();

      let cantidadGanadores = 1;
      if (datos && typeof datos === 'object') {
        cantidadGanadores = Object.keys(datos).length;
      }

      // Formato a 4 dígitos con ceros a la izquierda (ej: 0001, 0012)
      ganadorCodigoActual = String(cantidadGanadores).padStart(4, '0');
    } catch (error) {
      console.warn("Firebase offline o de prueba, generando código local:", error);
      const codigoLocal = Math.floor(Math.random() * 900) + 1;
      ganadorCodigoActual = String(codigoLocal).padStart(4, '0');
    }

    // Mostrar el cartel flotante de victoria
    codigoGanadorEl.textContent = `CÓDIGO: ${ganadorCodigoActual}`;
    modalVictoria.classList.add('active');
  }
});
