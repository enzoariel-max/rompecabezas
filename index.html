<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Rompecabezas El Rey</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0a0a0a;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center;overflow-x:hidden}
#app{width:100%;max-width:520px;min-height:100vh;padding:18px 12px 35px;text-align:center}
header{margin-bottom:18px}
.crown{font-size:30px;color:#f5c451;text-shadow:0 0 8px #f5c451,0 0 20px rgba(245,196,81,.6)}
h1{margin:2px 0 5px;font-family:Georgia,serif;font-size:clamp(30px,9vw,45px);line-height:.95;font-weight:900;background:linear-gradient(180deg,#fff8d6,#f5c451 40%,#b87500 75%,#ffeaa3);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(245,196,81,.3))}
.subtitle{color:#8e8e8e;font-size:11px;letter-spacing:4px;text-transform:uppercase}

#board{width:min(94vw,345px);aspect-ratio:1;margin:auto;padding:5px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;background:#050505;border:1px solid rgba(245,196,81,.35);border-radius:16px;box-shadow:0 0 15px rgba(245,196,81,.12),0 0 45px rgba(245,196,81,.08),inset 0 0 30px rgba(0,0,0,.9)}
.slot{position:relative;overflow:visible;border:1px dashed rgba(245,196,81,.2);border-radius:5px;background:rgba(255,255,255,.018)}

.arena-title{margin:20px 0 8px;color:#777;font-size:10px;letter-spacing:2px;text-transform:uppercase}
#arena{position:relative;width:100%;height:260px;min-height:200px;overflow:visible;border:1px solid rgba(245,196,81,.2);border-radius:18px;background:radial-gradient(circle at center,rgba(245,196,81,.05),transparent 65%);box-shadow:inset 0 0 30px rgba(0,0,0,.8)}

.piece{position:absolute;width:clamp(76px,25vw,95px);height:clamp(76px,25vw,95px);background-repeat:no-repeat;background-size:300% 300%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:left,top,transform;filter:drop-shadow(0 6px 8px rgba(0,0,0,.8)) drop-shadow(0 0 5px rgba(245,196,81,.12))}
.piece.dragging{cursor:grabbing;z-index:9999!important;filter:drop-shadow(0 12px 15px rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(245,196,81,.45))}

.p0{clip-path:polygon(0 0,38% 0,43% 8%,50% 12%,57% 8%,62% 0,100% 0,100% 38%,92% 43%,88% 50%,92% 57%,100% 62%,100% 100%,0 100%)}
.p1{clip-path:polygon(0 0,38% 0,43% 8%,50% 12%,57% 8%,62% 0,100% 0,100% 40%,92% 44%,88% 50%,92% 56%,100% 60%,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%,0 62%,8% 57%,12% 50%,8% 43%,0 38%)}
.p2{clip-path:polygon(0 0,100% 0,100% 38%,92% 43%,88% 50%,92% 57%,100% 62%,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%)}
.p3{clip-path:polygon(0 0,38% 0,43% 8%,50% 12%,57% 8%,62% 0,100% 0,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%,0 62%,8% 57%,12% 50%,8% 43%,0 38%)}
.p4{clip-path:polygon(0 0,38% 0,43% 8%,50% 12%,57% 8%,62% 0,100% 0,100% 38%,92% 43%,88% 50%,92% 57%,100% 62%,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%,0 62%,8% 57%,12% 50%,8% 43%,0 38%)}
.p5{clip-path:polygon(0 0,100% 0,100% 38%,92% 43%,88% 50%,92% 57%,100% 62%,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%,0 62%,8% 57%,12% 50%,8% 43%,0 38%)}
.p6{clip-path:polygon(0 0,38% 0,43% 8%,50% 12%,57% 8%,62% 0,100% 0,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%)}
.p7{clip-path:polygon(0 0,38% 0,43% 8%,50% 12%,57% 8%,62% 0,100% 0,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%)}
.p8{clip-path:polygon(0 0,100% 0,100% 100%,62% 100%,57% 92%,50% 88%,43% 92%,38% 100%,0 100%,0 62%,8% 57%,12% 50%,8% 43%,0 38%)}

#restart{margin-top:18px;padding:13px 28px;border:0;border-radius:50px;color:#090909;background:linear-gradient(135deg,#fff1b5,#f5c451,#a56b00);font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 20px rgba(245,196,81,.25),inset 0 1px rgba(255,255,255,.7)}
#restart:active{transform:scale(.95)}

#victory{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.84);backdrop-filter:blur(8px)}
#victory.show{display:flex}
.victory-card{width:min(92vw,380px);padding:30px 22px 25px;border:1px solid rgba(245,196,81,.6);border-radius:24px;background:radial-gradient(circle at 50% 0%,rgba(245,196,81,.18),transparent 55%),#101010;box-shadow:0 0 25px rgba(245,196,81,.2),0 0 80px rgba(245,196,81,.12);animation:aparecer .4s ease-out}
@keyframes aparecer{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.victory-crown{font-size:50px;color:#f5c451;text-shadow:0 0 20px #f5c451}
.victory-card h2{margin:5px 0;color:#f5c451;font-size:32px}
.victory-card p{color:#aaa}
#code{display:block;margin:15px 0 22px;color:#fff2bb;font-size:38px;font-weight:900;letter-spacing:5px;text-shadow:0 0 10px rgba(245,196,81,.8),0 0 25px rgba(245,196,81,.4)}
#cash{width:100%;padding:15px;border:0;border-radius:12px;color:#080808;background:linear-gradient(135deg,#fff0ac,#f5c451,#a56b00);font-size:18px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 25px rgba(245,196,81,.3)}
#cash:active{transform:scale(.97)}
.small-note{font-size:10px!important;color:#666!important}
</style>
</head>

<body>
<main id="app">
<header>
  <div class="crown">♛</div>
  <h1>Rompecabezas<br>El Rey</h1>
  <div class="subtitle">Desafío VIP</div>
</header>

<section id="board">
  <div class="slot" data-slot="0"></div>
  <div class="slot" data-slot="1"></div>
  <div class="slot" data-slot="2"></div>
  <div class="slot" data-slot="3"></div>
  <div class="slot" data-slot="4"></div>
  <div class="slot" data-slot="5"></div>
  <div class="slot" data-slot="6"></div>
  <div class="slot" data-slot="7"></div>
  <div class="slot" data-slot="8"></div>
</section>

<div class="arena-title">Arrastra las piezas al tablero</div>
<section id="arena"></section>
<button id="restart" type="button">↻ Reiniciar</button>
</main>

<div id="victory">
  <div class="victory-card">
    <div class="victory-crown">♛</div>
    <h2>¡GANASTE!</h2>
    <p>Completaste el rompecabezas</p>
    <span id="code">0001</span>
    <button id="cash" type="button">Cobrar</button>
    <p class="small-note">Presentá este código al solicitar tu premio.</p>
  </div>
</div>

<script>
"use strict";

const IMAGES = ["imagen1.jpeg","imagen2.jpeg","imagen3.jpeg"];

const COUNTER_NAMESPACE = "rompecabezas-el-rey-2026";
const COUNTER_ACTION = "victoria";
const COUNTER_KEY = "rompecabezas_rey_counter_2026";

const arena = document.getElementById("arena");
const board = document.getElementById("board");
const restartBtn = document.getElementById("restart");
const victory = document.getElementById("victory");
const codeElement = document.getElementById("code");
const cashBtn = document.getElementById("cash");
const slots = [...document.querySelectorAll(".slot")];

let pieces = [];
let currentImage = "";
let gameWon = false;
let draggedPiece = null;
let offsetX = 0;
let offsetY = 0;

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function randomFloat(min,max){
  return Math.random()*(max-min)+min;
}

function shuffle(array){
  const result = [...array];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function chooseImage(){
  let image;
  do{
    image=IMAGES[randomInt(0,IMAGES.length-1)];
  }while(IMAGES.length>1 && image===currentImage);
  currentImage=image;
  return image;
}

function createPieces(){
  document.querySelectorAll(".piece").forEach(p=>p.remove());
  pieces=[];

  for(let index=0;index<9;index++){
    const piece=document.createElement("div");
    piece.className="piece p"+index;
    piece.dataset.index=String(index);
    piece.dataset.position="arena";
    piece.dataset.slot="";
    piece.setAttribute("role","button");
    piece.setAttribute("aria-label","Pieza "+(index+1));
    piece.draggable=false;

    const column=index%3;
    const row=Math.floor(index/3);
    const positions=["0%","50%","100%"];

    piece.style.backgroundImage='url("'+currentImage+'")';
    piece.style.backgroundPosition=positions[column]+" "+positions[row];

    piece.addEventListener("touchstart",handleTouchStart,{passive:false});
    piece.addEventListener("touchmove",handleTouchMove,{passive:false});
    piece.addEventListener("touchend",handleTouchEnd,{passive:false});

    piece.addEventListener("mousedown",handleMouseDown);

    arena.appendChild(piece);
    pieces.push(piece);
  }
}

function getPieceSize(){
  const first=pieces[0];
  return first ? first.getBoundingClientRect().width : 90;
}

function scatterPieces(){
  const rect=arena.getBoundingClientRect();
  const size=getPieceSize();
  const maxX=Math.max(2,rect.width-size-2);
  const maxY=Math.max(2,rect.height-size-2);

  shuffle(pieces).forEach((piece,index)=>{
    piece.dataset.position="arena";
    piece.dataset.slot="";
    piece.classList.remove("locked");

    arena.appendChild(piece);

    const column=index%3;
    const row=Math.floor(index/3);

    let x=column*(maxX/2)+randomFloat(-22,22);
    let y=row*(maxY/2)+randomFloat(-20,20);

    x=Math.max(2,Math.min(x,maxX));
    y=Math.max(2,Math.min(y,maxY));

    piece.style.position="absolute";
    piece.style.width="";
    piece.style.height="";
    piece.style.left=x+"px";
    piece.style.top=y+"px";
    piece.style.transform="rotate("+randomFloat(-15,15)+"deg)";
    piece.style.zIndex=String(10+randomInt(0,20));
  });
}

function startDrag(piece,x,y){
  if(gameWon) return;

  draggedPiece=piece;

  const rect=piece.getBoundingClientRect();
  offsetX=x-rect.left;
  offsetY=y-rect.top;

  document.body.appendChild(piece);

  piece.style.position="fixed";
  piece.style.width=rect.width+"px";
  piece.style.height=rect.height+"px";
  piece.style.left=(x-offsetX)+"px";
  piece.style.top=(y-offsetY)+"px";
  piece.style.transform="rotate(0deg)";
  piece.style.zIndex="9999";
  piece.classList.add("dragging");
}

function moveDrag(x,y){
  if(!draggedPiece) return;
  draggedPiece.style.left=(x-offsetX)+"px";
  draggedPiece.style.top=(y-offsetY)+"px";
}

function getSlotAtPoint(x,y){
  if(draggedPiece) draggedPiece.style.visibility="hidden";
  const element=document.elementFromPoint(x,y);
  if(draggedPiece) draggedPiece.style.visibility="visible";
  return element ? element.closest(".slot") : null;
}

function returnToArena(piece,x,y){
  arena.appendChild(piece);

  const rect=arena.getBoundingClientRect();
  const size=piece.getBoundingClientRect().width || getPieceSize();

  let left=x-rect.left-size/2;
  let top=y-rect.top-size/2;

  left=Math.max(2,Math.min(left,rect.width-size-2));
  top=Math.max(2,Math.min(top,rect.height-size-2));

  piece.dataset.position="arena";
  piece.dataset.slot="";
  piece.classList.remove("locked");

  piece.style.position="absolute";
  piece.style.width="";
  piece.style.height="";
  piece.style.left=left+"px";
  piece.style.top=top+"px";
  piece.style.transform="rotate("+randomFloat(-15,15)+"deg)";
  piece.style.zIndex=String(10+randomInt(0,20));
}

function putInSlot(piece,slot){
  const oldPiece=slot.querySelector(".piece");

  if(oldPiece && oldPiece!==piece){
    returnToArena(
      oldPiece,
      window.innerWidth*0.5+randomFloat(-80,80),
      window.innerHeight-80
    );
  }

  slot.appendChild(piece);

  piece.dataset.position="board";
  piece.dataset.slot=slot.dataset.slot;
  piece.classList.add("locked");

  piece.style.position="absolute";
  piece.style.width="calc(100% + 4px)";
  piece.style.height="calc(100% + 4px)";
  piece.style.left="50%";
  piece.style.top="50%";
  piece.style.transform="translate(-50%,-50%) rotate(0deg)";
  piece.style.zIndex="50";
}

function finishDrag(x,y){
  if(!draggedPiece) return;

  const piece=draggedPiece;
  piece.classList.remove("dragging");

  const slot=getSlotAtPoint(x,y);

  if(slot){
    putInSlot(piece,slot);
  }else{
    returnToArena(piece,x,y);
  }

  draggedPiece=null;
  checkVictory();
}

function handleTouchStart(event){
  event.preventDefault();
  const touch=event.touches[0];
  if(touch) startDrag(event.currentTarget,touch.clientX,touch.clientY);
}

function handleTouchMove(event){
  event.preventDefault();
  if(!draggedPiece) return;
  const touch=event.touches[0];
  if(touch) moveDrag(touch.clientX,touch.clientY);
}

function handleTouchEnd(event){
  event.preventDefault();
  if(!draggedPiece) return;
  const touch=event.changedTouches[0];
  finishDrag(touch ? touch.clientX : 0,touch ? touch.clientY : 0);
}

function handleMouseDown(event){
  event.preventDefault();
  startDrag(event.currentTarget,event.clientX,event.clientY);
}

document.addEventListener("mousemove",event=>{
  if(draggedPiece) moveDrag(event.clientX,event.clientY);
});

document.addEventListener("mouseup",event=>{
  if(draggedPiece) finishDrag(event.clientX,event.clientY);
});

function checkVictory(){
  if(gameWon) return;

  const complete=pieces.every(piece=>{
    if(piece.dataset.position!=="board") return false;
    const slot=piece.parentElement;
    return slot && Number(piece.dataset.index)===Number(slot.dataset.slot);
  });

  if(!complete) return;

  gameWon=true;

  setTimeout(async()=>{
    const number=await incrementGlobalCounter();
    showVictory(number);
  },350);
}

async function incrementGlobalCounter(){
  const url=
    "https://counterapi.com/api/"+
    encodeURIComponent(COUNTER_NAMESPACE)+"/"+
    encodeURIComponent(COUNTER_ACTION)+"/"+
    encodeURIComponent(COUNTER_KEY);

  try{
    const response=await fetch(url,{method:"GET",cache:"no-store"});

    if(!response.ok) throw new Error("HTTP "+response.status);

    const data=await response.json();
    const value=Number(data.value);

    if(!Number.isFinite(value)) throw new Error("Valor inválido");

    localStorage.setItem("rey_counter_backup",String(value));
    return value;
  }catch(error){
    console.error("Contador global no disponible:",error);

    let fallback=Number(localStorage.getItem("rey_counter_backup"))||0;
    fallback++;
    localStorage.setItem("rey_counter_backup",String(fallback));
    return fallback;
  }
}

function showVictory(number){
  const code=String(number).padStart(4,"0");
  codeElement.textContent=code;
  victory.dataset.code=code;
  victory.classList.add("show");
}

cashBtn.addEventListener("click",()=>{
  const code=victory.dataset.code || codeElement.textContent;
  const message="felicitaciones por finalizar el rompecabezas. Mi código es: "+code;
  const url="https://wa.me/541124050658?text="+encodeURIComponent(message);
  window.location.href=url;
});

restartBtn.addEventListener("click",()=>{
  gameWon=false;
  victory.classList.remove("show");
  chooseImage();
  createPieces();
  requestAnimationFrame(scatterPieces);
});

window.addEventListener("resize",()=>{
  if(!pieces.length) return;

  requestAnimationFrame(()=>{
    const rect=arena.getBoundingClientRect();

    pieces.forEach(piece=>{
      if(piece.dataset.position!=="arena") return;

      const size=piece.getBoundingClientRect().width;
      let x=parseFloat(piece.style.left)||0;
      let y=parseFloat(piece.style.top)||0;

      x=Math.max(2,Math.min(x,rect.width-size-2));
      y=Math.max(2,Math.min(y,rect.height-size-2));

      piece.style.left=x+"px";
      piece.style.top=y+"px";
    });
  });
});

function init(){
  chooseImage();
  createPieces();
  requestAnimationFrame(scatterPieces);
}

init();
</script>
</body>
</html>
